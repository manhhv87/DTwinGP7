    <text x="841" y="65" font-size="11.5" fill="#5a6673" text-anchor="middle">420</text>
    <line x1="643.8" y1="89.8" x2="643.8" y2="342.2" stroke="#5a6673" stroke-width="1" marker-start="url(#d2)" marker-end="url(#d2)"/>
    <text x="636" y="216" font-size="11.5" fill="#5a6673" text-anchor="middle" transform="rotate(-90 636 216)">297</text>
    <line x1="977.0" y1="131.0" x2="977.0" y2="301.0" stroke="#5a6673" stroke-width="1" marker-start="url(#d2)" marker-end="url(#d2)"/>
    <text x="991" y="216" font-size="11.5" fill="#5a6673" text-anchor="middle" transform="rotate(-90 991 216)">200</text>
    <text x="612" y="400" font-size="12" fill="#5a6673">Hai thanh gá dán đối xứng qua tâm, chạy dọc cạnh 420.</text>
    <text x="612" y="418" font-size="12" fill="#5a6673">Số 200 đo giữa hai mặt NGOÀI; khe giữa hai thanh khi đó là 120.</text>
    <text x="612" y="436" font-size="12" fill="#5a6673">Mũi tên cam là chiều má kẹp đóng vào.</text>
    <rect x="612" y="452" width="484" height="122" rx="3" fill="#eef3f7" stroke="#93aec6" stroke-width="1"/>
    <text x="628" y="474" font-size="12.5" fill="#24506f" font-weight="700">Giữ tấm cao bao nhiêu: hai ràng buộc ngược nhau</text>
    <text x="628" y="493" font-size="11.5" fill="#24506f">Camera: trên 505 mm hoa văn tràn khung. Nghiêng tấm ăn thêm biên,</text>
    <text x="628" y="509" font-size="11.5" fill="#24506f">nên lấy trần an toàn 470 mm. Dưới 250 mm hoa văn chỉ chiếm 1/3 khung.</text>
    <text x="628" y="530" font-size="11.5" fill="#24506f">Cơ khí: lật kẹp lên thì mặt bích nằm ở h − H, với H là khoảng cách</text>
    <text x="628" y="546" font-size="11.5" fill="#24506f">mặt bích tới mặt trên má kẹp. Phải có h ≥ H + 50 để mặt bích không</text>
    <text x="628" y="562" font-size="11.5" fill="#24506f">chạm bàn. Ước lượng H = 250–330 mm, nhưng PHẢI ĐO.</text>
    <rect x="612" y="590" width="484" height="62" rx="3" fill="none" stroke="#b45309" stroke-width="1.5"/>
    <text x="628" y="614" font-size="12" fill="#7a4d06" font-weight="700">Lắp và tháo tấm phải hai người. Mở kẹp là tấm rơi.</text>
    <text x="628" y="633" font-size="12" fill="#7a4d06">Gá xong lắc thử tay. Thấy rơ một chút là làm lại.</text>
