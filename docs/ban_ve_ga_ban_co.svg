    <text x="26" y="52" font-size="12" fill="#5a6673">Cả bộ kẹp nằm dưới tấm, nên không che hoa văn.</text>
    <text x="26" y="70" font-size="12" fill="#b45309">Bộ kẹp vẽ phỏng theo ảnh chụp, chưa đo.</text>
