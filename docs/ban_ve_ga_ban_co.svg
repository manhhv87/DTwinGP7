    <text x="38" y="490" font-size="12.5" font-weight="700" text-anchor="middle">1</text>
    <text x="58" y="487" font-size="12.5" fill="#1f2933" font-weight="600">Camera D455 cố định trên giá</text>
    <text x="58" y="503" font-size="11.5" fill="#5a6673">cao 710 mm, nhìn thẳng xuống</text>
    <circle cx="38" cy="528" r="10.5" fill="none" stroke="#3d474f" stroke-width="1.4"/>
    <text x="38" y="532" font-size="12.5" font-weight="700" text-anchor="middle">2</text>
    <text x="58" y="529" font-size="12.5" fill="#1f2933" font-weight="600">Tấm bàn cờ, mặt in NGỬA LÊN</text>
    <text x="58" y="545" font-size="11.5" fill="#5a6673">vạch cam là mặt in; úp xuống thì camera không thấy gì</text>
    <circle cx="38" cy="570" r="10.5" fill="none" stroke="#3d474f" stroke-width="1.4"/>
    <text x="38" y="574" font-size="12.5" font-weight="700" text-anchor="middle">3</text>
    <text x="58" y="571" font-size="12.5" fill="#1f2933" font-weight="600">Hai thanh gá kẹp vào hai má kẹp</text>
    <text x="58" y="587" font-size="11.5" fill="#5a6673">chi tiết xem bản vẽ ban_ve_ga_3d</text>
    <circle cx="38" cy="612" r="10.5" fill="none" stroke="#3d474f" stroke-width="1.4"/>
    <text x="38" y="616" font-size="12.5" font-weight="700" text-anchor="middle">4</text>
    <text x="58" y="613" font-size="12.5" fill="#1f2933" font-weight="600">Cổ tay lật cho kẹp hướng LÊN TRỜI</text>
    <text x="58" y="629" font-size="11.5" fill="#5a6673">cả bộ kẹp nằm dưới tấm</text>
    <line x1="586.0" y1="24.0" x2="586.0" y2="636.0" stroke="#ccd5dd" stroke-width="1"/>
    <text x="612" y="32" font-size="16" fill="#1f2933" font-weight="700">Nhìn từ dưới lên, lưng tấm</text>
    <text x="612" y="52" font-size="12" fill="#5a6673">Hoa văn ở mặt bên kia. Kích thước thật, mm.</text>
