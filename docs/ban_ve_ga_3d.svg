<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 660" width="1120" height="660"
     role="img" aria-label="Mat cat ngang cum ga ban co len kep: hai thanh nhom dan duoi lung tam thut vao giua hai ma kep den, hai mat ngoai cach nhau 200 mm, con tam ti len mat tren hai ma kep; kem hai buoc lap">
  <defs>
    <marker id="d2" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5a6673"/>
    </marker>
    <marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b45309"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1120" height="660" fill="#ffffff"/>
  <g font-family="'Segoe UI',system-ui,sans-serif" fill="#1f2933">
    <text x="26" y="32" font-size="16" fill="#1f2933" font-weight="700">Mặt cắt ngang, cắt vuông góc hai má kẹp</text>
    <text x="26" y="52" font-size="12" fill="#5a6673">Cổ tay đã lật cho kẹp hướng lên.</text>
    <text x="26" y="70" font-size="12" fill="#b45309">Bộ kẹp vẽ phỏng theo ảnh chụp, chưa đo. Số để mua vật tư phải lấy từ thước kẹp.</text>
    <rect x="43.0" y="268.2" width="496.0" height="31.0" fill="#eceff2" stroke="#3d474f" stroke-width="0.9"/>
    <rect x="94.2" y="190.8" width="18.6" height="77.5" fill="#eceff2" stroke="#3d474f" stroke-width="0.9"/>
    <rect x="469.2" y="190.8" width="18.6" height="77.5" fill="#eceff2" stroke="#3d474f" stroke-width="0.9"/>
    <rect x="112.8" y="152.0" width="23.2" height="38.8" fill="#454c54" stroke="#3d474f" stroke-width="1.1"/>
    <rect x="446.0" y="152.0" width="23.2" height="38.8" fill="#454c54" stroke="#3d474f" stroke-width="1.1"/>
    <rect x="136.0" y="152.0" width="62.0" height="31.0" fill="#cbd7e2" stroke="#3d474f" stroke-width="1.1"/>
    <rect x="384.0" y="152.0" width="62.0" height="31.0" fill="#cbd7e2" stroke="#3d474f" stroke-width="1.1"/>
    <rect x="60.8" y="142.7" width="460.3" height="9.3" fill="#f4f7fa" stroke="#3d474f" stroke-width="1.1"/>
    <rect x="60.8" y="139.6" width="460.3" height="3.1" fill="#b45309" stroke="#3d474f" stroke-width="0"/>
    <line x1="60.0" y1="162.0" x2="108.0" y2="162.0" stroke="#b45309" stroke-width="2.4" marker-end="url(#am)"/>
    <line x1="522.0" y1="162.0" x2="474.0" y2="162.0" stroke="#b45309" stroke-width="2.4" marker-end="url(#am)"/>
    <line x1="60.8" y1="99.3" x2="521.2" y2="99.3" stroke="#5a6673" stroke-width="1" marker-start="url(#d2)" marker-end="url(#d2)"/>
    <text x="291" y="96" font-size="11.5" fill="#5a6673" text-anchor="middle">297</text>
    <line x1="198.0" y1="209.3" x2="384.0" y2="209.3" stroke="#5a6673" stroke-width="1" marker-start="url(#d2)" marker-end="url(#d2)"/>
    <text x="291" y="224" font-size="11.5" fill="#5a6673" text-anchor="middle">120</text>
    <line x1="136.0" y1="249.7" x2="446.0" y2="249.7" stroke="#5a6673" stroke-width="1" marker-start="url(#d2)" marker-end="url(#d2)"/>
    <text x="291" y="264" font-size="11.5" fill="#5a6673" text-anchor="middle">200</text>
    <line x1="50.2" y1="129.3" x2="70.0" y2="147.0" stroke="#3d474f" stroke-width="1"/>
    <circle cx="42.0" cy="122.0" r="11" fill="#ffffff" stroke="#3d474f" stroke-width="1.4"/>
    <text x="42.0" y="126.5" font-size="13" font-weight="700" text-anchor="middle">1</text>
    <line x1="415.0" y1="189.0" x2="415.0" y2="184.0" stroke="#3d474f" stroke-width="1"/>
    <circle cx="415.0" cy="200.0" r="11" fill="#ffffff" stroke="#3d474f" stroke-width="1.4"/>
    <text x="415.0" y="204.5" font-size="13" font-weight="700" text-anchor="middle">2</text>
    <line x1="522.9" y1="191.6" x2="469.0" y2="168.0" stroke="#3d474f" stroke-width="1"/>
    <circle cx="533.0" cy="196.0" r="11" fill="#ffffff" stroke="#3d474f" stroke-width="1.4"/>
    <text x="533.0" y="200.5" font-size="13" font-weight="700" text-anchor="middle">3</text>
    <line x1="522.6" y1="244.3" x2="488.0" y2="232.0" stroke="#3d474f" stroke-width="1"/>
    <circle cx="533.0" cy="248.0" r="11" fill="#ffffff" stroke="#3d474f" stroke-width="1.4"/>
    <text x="533.0" y="252.5" font-size="13" font-weight="700" text-anchor="middle">4</text>
    <line x1="291.0" y1="319.0" x2="291.0" y2="285.0" stroke="#3d474f" stroke-width="1"/>
    <circle cx="291.0" cy="330.0" r="11" fill="#ffffff" stroke="#3d474f" stroke-width="1.4"/>
    <text x="291.0" y="334.5" font-size="13" font-weight="700" text-anchor="middle">5</text>
    <circle cx="38" cy="396" r="10.5" fill="none" stroke="#3d474f" stroke-width="1.4"/>
    <text x="38" y="400" font-size="12.5" font-weight="700" text-anchor="middle">1</text>
    <text x="58" y="397" font-size="12.5" fill="#1f2933" font-weight="600">Tấm bàn cờ 420 × 297, alu 3 mm</text>
    <text x="58" y="413" font-size="11.5" fill="#5a6673">mặt in ngửa lên camera (vạch cam)</text>
    <circle cx="38" cy="440" r="10.5" fill="none" stroke="#3d474f" stroke-width="1.4"/>
    <text x="38" y="444" font-size="12.5" font-weight="700" text-anchor="middle">2</text>
    <text x="58" y="441" font-size="12.5" fill="#1f2933" font-weight="600">Hai thanh gá, nhôm hộp 20 × 40 thành dày</text>
    <text x="58" y="457" font-size="11.5" fill="#5a6673">bạn làm: dán epoxy vào lưng tấm</text>
    <circle cx="38" cy="484" r="10.5" fill="none" stroke="#3d474f" stroke-width="1.4"/>
    <text x="38" y="488" font-size="12.5" font-weight="700" text-anchor="middle">3</text>
    <text x="58" y="485" font-size="12.5" fill="#1f2933" font-weight="600">Hai má kẹp đen</text>
    <text x="58" y="501" font-size="11.5" fill="#5a6673">có sẵn trên robot; tấm tì lên mặt trên của chúng</text>
    <circle cx="38" cy="528" r="10.5" fill="none" stroke="#3d474f" stroke-width="1.4"/>
    <text x="38" y="532" font-size="12.5" font-weight="700" text-anchor="middle">4</text>
    <text x="58" y="529" font-size="12.5" fill="#1f2933" font-weight="600">Giá đỡ má kẹp</text>
    <text x="58" y="545" font-size="11.5" fill="#5a6673">thấp hơn mặt trên má kẹp nên không vướng tấm</text>
    <circle cx="38" cy="572" r="10.5" fill="none" stroke="#3d474f" stroke-width="1.4"/>
    <text x="38" y="576" font-size="12.5" font-weight="700" text-anchor="middle">5</text>
    <text x="58" y="573" font-size="12.5" fill="#1f2933" font-weight="600">Càng ngang</text>
    <text x="58" y="589" font-size="11.5" fill="#5a6673">nằm dưới tấm, không che hoa văn</text>
    <text x="38" y="620" font-size="11.5" fill="#5a6673">Mũi tên cam là chiều kẹp đóng vào. Số 200 là hai mặt NGOÀI của hai thanh gá,</text>
    <text x="38" y="637" font-size="11.5" fill="#5a6673">phải đúng; khe giữa hai thanh khi đó là 120.</text>
    <line x1="586.0" y1="24.0" x2="586.0" y2="636.0" stroke="#ccd5dd" stroke-width="1"/>
    <text x="612" y="32" font-size="16" fill="#1f2933" font-weight="700">Trình tự gá, hai bước</text>
    <rect x="662.2" y="150.0" width="9.0" height="15.0" fill="#454c54" stroke="#3d474f" stroke-width="0.9"/>
    <rect x="800.8" y="150.0" width="9.0" height="15.0" fill="#454c54" stroke="#3d474f" stroke-width="0.9"/>
    <rect x="676.0" y="120.0" width="24.0" height="12.0" fill="#cbd7e2" stroke="#3d474f" stroke-width="0.9"/>
    <rect x="772.0" y="120.0" width="24.0" height="12.0" fill="#cbd7e2" stroke="#3d474f" stroke-width="0.9"/>
    <rect x="646.9" y="116.4" width="178.2" height="3.6" fill="#f4f7fa" stroke="#3d474f" stroke-width="0.9"/>
    <line x1="736.0" y1="99.6" x2="736.0" y2="112.8" stroke="#b45309" stroke-width="2.4" marker-end="url(#am)"/>
    <rect x="907.0" y="150.0" width="9.0" height="15.0" fill="#454c54" stroke="#3d474f" stroke-width="0.9"/>
    <rect x="1036.0" y="150.0" width="9.0" height="15.0" fill="#454c54" stroke="#3d474f" stroke-width="0.9"/>
    <rect x="916.0" y="150.0" width="24.0" height="12.0" fill="#cbd7e2" stroke="#3d474f" stroke-width="0.9"/>
    <rect x="1012.0" y="150.0" width="24.0" height="12.0" fill="#cbd7e2" stroke="#3d474f" stroke-width="0.9"/>
    <rect x="886.9" y="146.4" width="178.2" height="3.6" fill="#f4f7fa" stroke="#3d474f" stroke-width="0.9"/>
    <line x1="884.8" y1="157.2" x2="902.8" y2="157.2" stroke="#b45309" stroke-width="2.2" marker-end="url(#am)"/>
    <line x1="1067.2" y1="157.2" x2="1049.2" y2="157.2" stroke="#b45309" stroke-width="2.2" marker-end="url(#am)"/>
    <text x="736" y="196" font-size="12.5" fill="#1f2933" font-weight="700" text-anchor="middle">1. Mở kẹp hết cỡ, hạ tấm xuống</text>
    <text x="736" y="214" font-size="11.5" fill="#5a6673" text-anchor="middle">Hai thanh gá thụt vào giữa hai má kẹp.</text>
    <text x="736" y="230" font-size="11.5" fill="#5a6673" text-anchor="middle">Hạ tới khi tấm chạm mặt trên má kẹp.</text>
    <text x="976" y="196" font-size="12.5" fill="#1f2933" font-weight="700" text-anchor="middle">2. Đóng kẹp về 200</text>
    <text x="976" y="214" font-size="11.5" fill="#5a6673" text-anchor="middle">Má kẹp ép vào hai mặt ngoài thanh gá.</text>
    <text x="976" y="230" font-size="11.5" fill="#5a6673" text-anchor="middle">Lắc thử tay, thấy rơ là làm lại.</text>
    <text x="612" y="292" font-size="13.5" fill="#1f2933" font-weight="700">Ba số phải đo trên kẹp thật trước khi mua nhôm</text>
    <text x="612" y="314" font-size="12" fill="#5a6673">Chiều dài má kẹp đen: cắt thanh gá bằng đúng số này.</text>
    <text x="612" y="332" font-size="12" fill="#5a6673">Chiều cao má kẹp: thanh gá phải thấp hơn, để tấm tì được lên má.</text>
    <text x="612" y="350" font-size="12" fill="#5a6673">Khe mở lớn nhất: phải lớn hơn 200 mm mới lồng tấm vào được.</text>
    <rect x="612" y="382" width="484" height="62" rx="3" fill="none" stroke="#b45309" stroke-width="1.5"/>
    <text x="628" y="406" font-size="12" fill="#7a4d06" font-weight="600">Cắt một miếng gỗ dài đúng 120 mm, chèn giữa hai thanh trong lúc</text>
    <text x="628" y="424" font-size="12" fill="#7a4d06" font-weight="600">keo epoxy khô, xong tháo ra. Đó là cách giữ đúng khoảng cách 200.</text>
    <text x="612" y="486" font-size="13.5" fill="#1f2933" font-weight="700">Vì sao hai thanh song song</text>
    <text x="612" y="508" font-size="12" fill="#5a6673">Thanh gá dài 200 cao 20 cho mỗi bên một dải tiếp xúc 200 × 20 mm.</text>
    <text x="612" y="526" font-size="12" fill="#5a6673">Một thanh vuông 40 × 40 đặt giữa thì mỗi bên chỉ được 40 × 40 mm.</text>
    <text x="612" y="544" font-size="12" fill="#5a6673">Dải dài giữ hướng tốt hơn mảng nhỏ.</text>
    <text x="612" y="570" font-size="12" fill="#5a6673">Trọng lượng do mặt trên má kẹp đỡ, không treo vào lực kẹp, nên không</text>
    <text x="612" y="588" font-size="12" fill="#5a6673">cần gờ dưới kiểu chữ I. Mà có gờ dưới thì lại không lồng tấm từ trên</text>
    <text x="612" y="606" font-size="12" fill="#5a6673">xuống được nữa.</text>
  </g>
</svg>