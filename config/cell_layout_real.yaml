# =============================================================================
# Cell Layout Configuration cho REAL ROBOT mode
# =============================================================================
# File này MIRROR cell_layout.yaml để digital twin trong RoboDK trông GIỐNG sim,
# chỉ khác:
#   - camera.type: "real" (D455 thật, không phải Cam2D virtual của RoboDK)
#   - robot_connection.enabled: true (gửi command tới YRC1000)
#   - max_speed_percent / acceleration_percent: safety limits cho real
#
# Trước khi dùng:
#   1. YRC1000 controller bật, kết nối Ethernet
#   2. PC và controller cùng subnet (vd 192.168.1.x)
#   3. Đã ping được IP của YRC1000
#   4. High Speed Ethernet Server function đã enable trên YRC1000
#   5. KHÔNG cần RoboDK lúc chạy: viewport 3D là Open3D, motion đi qua HSE UDP
#      (MotomanHSEBackend). RoboDK chỉ dùng verify FK/IK (scripts 13 + 17).
#   6. TOOL01 đã setup trên teach pendant (cho --ik-source yrc) — xem docs/HUONG_DAN_CAI_DAT.md §2.10
#
# Khi cell vật lý KHÁC sim (vd không có pedestal, bàn ở vị trí khác), copy file
# này thành biến thể riêng + đo lại các pose cho đúng cell thật.
# =============================================================================

metadata:
  version: "1.0.0-real"
  last_modified: "2026-05-20"
  author: "Master Thesis - GP7 Pick Place"
  notes: |
    Config cho REAL GP7 + YRC1000 (Pha 7).
    Mirror sim layout — robot trên pedestal, bàn X=700, camera 700mm trên bàn.


# ─────────────────────────────────────────────────────────────────────────────
# ROBOT
# ─────────────────────────────────────────────────────────────────────────────
robot:
  name: "Yaskawa GP7"
  source: "library"
  library_name: "Yaskawa-GP7.robot"

  # J1 ở Z=630 = đỉnh pedestal (300mm) + built-in stand (~330mm). Cell vật lý
  # phải đặt robot lên pedestal cao 300mm để khớp config này. Nếu robot bắt
  # thẳng xuống sàn → xoá robot_pedestal + đổi pose.xyz_mm thành [0, 0, 0].
  pose:
    xyz_mm: [0, 0, 630]
    rpy_deg: [0, 0, 0]

  home_joints_deg: [1.97, 2.26, -4.99, -181.93, 41.7, -90.35]


# ─────────────────────────────────────────────────────────────────────────────
# FLOOR
# ─────────────────────────────────────────────────────────────────────────────
floor:
  mesh: "models/floor.stl"
  pose:
    xyz_mm: [300, 0, 0]
    rpy_deg: [0, 0, 0]
  color_rgb: [0.82, 0.82, 0.86]


# ─────────────────────────────────────────────────────────────────────────────
# WORKTABLE
# ─────────────────────────────────────────────────────────────────────────────
worktable:
  mesh: "models/worktable.stl"
  pose:
    xyz_mm: [700, 0, 0]
    rpy_deg: [0, 0, 90]
  color_rgb: [0.52, 0.55, 0.58]


# ─────────────────────────────────────────────────────────────────────────────
# ROBOT PEDESTAL (nâng robot lên 300mm)
# ─────────────────────────────────────────────────────────────────────────────
robot_pedestal:
  mesh: "models/pedestal.stl"
  pose:
    xyz_mm: [0, 0, 0]
    rpy_deg: [0, 0, 0]
  color_rgb: [0.4, 0.4, 0.4]


# ─────────────────────────────────────────────────────────────────────────────
# CAMERA MOUNT
# ─────────────────────────────────────────────────────────────────────────────
camera_mount:
  mesh: "models/camera_mount.stl"
  pose:
    xyz_mm: [700, 0, 500]
    rpy_deg: [0, 0, 0]


# ─────────────────────────────────────────────────────────────────────────────
# CAMERA (D455 thật)
# ─────────────────────────────────────────────────────────────────────────────
camera:
  type: "real"                            # D455 thật (KHÔNG phải Cam2D virtual)
  model: "Intel RealSense D455"
  pose:
    xyz_mm: [700, 0, 1200]                # 700mm trên mặt bàn (sweet spot D455)
    rpy_deg: [180, 0, 0]                  # nhìn xuống
  intrinsics:
    fov_deg: 87
    focal_length_mm: 1.93
    size_px: [1280, 720]


# ─────────────────────────────────────────────────────────────────────────────
# GRIPPER
# ─────────────────────────────────────────────────────────────────────────────
gripper:
  name: "TwoFingerGripper"
  mesh: "models/gripper.stl"
  tcp_offset_xyz_mm: [0, 0, 100]          # PLACEHOLDER — đo lại sau khi lắp gripper thật
  tcp_offset_rpy_deg: [0, 0, 0]


# ─────────────────────────────────────────────────────────────────────────────
# REFERENCE FRAMES
# ─────────────────────────────────────────────────────────────────────────────
frames:
  - name: "WorkpieceArea"
    pose:
      xyz_mm: [700, 0, 500]
      rpy_deg: [0, 0, 0]

  - name: "PlaceZone"
    pose:
      xyz_mm: [700, 120, 500]
      rpy_deg: [0, 0, 0]

  - name: "CalibrationTarget"
    pose:
      xyz_mm: [700, 0, 510]
      rpy_deg: [0, 0, 0]


# ─────────────────────────────────────────────────────────────────────────────
# OBJECT TEMPLATES
# ─────────────────────────────────────────────────────────────────────────────
objects:
  - name: "tray"
    mesh: "models/objects/tray.stl"
    visible: false
    parent_frame: "WorkpieceArea"
    pose:
      xyz_mm: [0, -120, 0]
      rpy_deg: [0, 0, 0]

  - name: "bottle"
    mesh: "models/objects/bottle.stl"
    visible: false
    parent_frame: "WorkpieceArea"
    pose:
      xyz_mm: [0, 0, 0]
      rpy_deg: [0, 0, 0]

  - name: "cup"
    mesh: "models/objects/cup.stl"
    visible: false
    parent_frame: "WorkpieceArea"
    pose:
      xyz_mm: [0, 120, 0]
      rpy_deg: [0, 0, 0]

  - name: "bolt"
    mesh: "models/objects/bolt.stl"
    visible: false
    parent_frame: "WorkpieceArea"
    pose:
      xyz_mm: [60, 60, 0]
      rpy_deg: [0, 0, 0]


# ─────────────────────────────────────────────────────────────────────────────
# REAL ROBOT CONNECTION
# ─────────────────────────────────────────────────────────────────────────────
robot_connection:
  # HSE-only architecture: enabled=false để CellLoader KHÔNG gọi robot.Connect()
  # (RoboDK chỉ là viewport, không là motion driver). Motion đi qua
  # MotomanHSEBackend (UDP 10040). enabled=true sẽ kích hoạt RoboDK driver
  # (cần license tier cao + crash với RoboDK Free) — KHÔNG dùng. Xem Phu_luc_A §A.9.
  enabled: false                          # PHẢI false cho HSE-only
  ip: "192.168.1.100"                     # ĐỔI theo IP YRC1000 thực tế (= default cho --hse-ip)
  port: 80                                # cosmetic — HSE thực dùng UDP 10040
  driver: "Motoman"                       # cosmetic — ghi brand, không gọi driver
  max_speed_percent: 30                   # safety: cap tốc độ INFORM VJ xuống 30%
  acceleration_percent: 50                # safety: gia tốc 50%
