# =============================================================================
# Cell Layout Configuration cho REAL ROBOT mode
# =============================================================================
# Config này dùng khi đã sẵn sàng kết nối GP7 thật qua RoboDK Motoman driver.
# Khác với cell_layout.yaml chỉ ở phần robot_connection và một vài tinh chỉnh.
#
# Trước khi dùng, đảm bảo:
#   1. YRC1000 controller bật, kết nối Ethernet
#   2. PC và controller cùng subnet (vd 192.168.1.x)
#   3. Đã ping được IP của YRC1000
#   4. High Speed Ethernet Server function đã enable trên YRC1000
# =============================================================================

metadata:
  version: "1.0.0-real"
  last_modified: "2025-01-15"
  notes: "Config cho REAL GP7 + YRC1000. Sử dụng từ Pha 7."


robot:
  name: "Yaskawa GP7"
  source: "library"
  library_name: "Yaskawa-GP7.robot"
  pose:
    xyz_mm: [0, 0, 0]                     # robot trên sàn, dùng built-in floor stand
    rpy_deg: [0, 0, 0]
  home_joints_deg: [1.97, 2.26, -4.99, -181.93, 41.7, -90.35]   # capture từ RoboDK GUI (save_current_as_home.py)


floor:
  mesh: "models/floor.stl"                # sàn 3000×3000 mm, mặt trên Z=0
  pose:
    xyz_mm: [300, 0, 0]
    rpy_deg: [0, 0, 0]
  color_rgb: [0.82, 0.82, 0.86]


worktable:
  mesh: "models/worktable.stl"            # bàn primitive 600×400×500 mm (robot trên sàn)
  pose:
    xyz_mm: [480, 0, 0]                   # ĐO LẠI vị trí bàn thật so với gốc robot
    rpy_deg: [0, 0, 90]                   # XOAY 90° quanh Z (đồng bộ sim mode)
  color_rgb: [0.6, 0.6, 0.7]


camera_mount:
  mesh: "models/camera_mount.stl"
  pose:
    xyz_mm: [480, 0, 500]
    rpy_deg: [0, 0, 0]


camera:
  type: "real"                            # đánh dấu camera thật (vẫn add ảo trong RoboDK)
  model: "Intel RealSense D455"
  pose:
    xyz_mm: [480, 0, 1350]                # 850 mm trên mặt bàn — ĐO LẠI khi lắp D455 thật
    rpy_deg: [180, 0, 0]
  intrinsics:
    fov_deg: 87
    focal_length_mm: 1.93
    size_px: [1280, 720]


gripper:
  name: "TwoFingerGripper"
  mesh: "models/gripper.stl"
  tcp_offset_xyz_mm: [0, 0, 100]  # pneumatic parallel-jaw WIDE (200mm opening) cho Galaxy S23 tray, palm 60 + finger 40
  tcp_offset_rpy_deg: [0, 0, 0]


frames:
  - name: "WorkpieceArea"
    pose:
      xyz_mm: [480, 0, 500]
      rpy_deg: [0, 0, 0]
  - name: "PlaceZone"
    pose:
      xyz_mm: [480, 120, 500]
      rpy_deg: [0, 0, 0]


objects:
  - name: "tray"
    mesh: "models/objects/tray.stl"
    visible: false
    parent_frame: "WorkpieceArea"


# ─────────────────────────────────────────────────────────────────────────────
# Real robot connection
# ─────────────────────────────────────────────────────────────────────────────
robot_connection:
  enabled: true                           # ENABLE for real robot
  ip: "192.168.1.100"                     # ĐỔI theo IP YRC1000 thực tế
  port: 80
  driver: "Motoman"
  # Safety limits
  max_speed_percent: 30                   # giới hạn tốc độ thí nghiệm
  acceleration_percent: 50
