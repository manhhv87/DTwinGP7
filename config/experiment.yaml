# =============================================================================
# experiment.yaml — Cấu hình thí nghiệm pick-and-place
# =============================================================================
# Dùng bởi scripts/03_run_experiment.py. Các key dưới được nạp trực tiếp vào
# Orchestrator (xem src/orchestrator/orchestrator.py :: _DEFAULT_CONFIG).
# =============================================================================

# ───── Robot + calibration ─────
robot_name: "Yaskawa GP7"
calibration_path: "config/calibration/T_base_camera.npy"

# ───── Điểm PLACE trên băng tải (base frame, mm) ─────
# Bài toán: PICK vật random trên BÀN (dưới camera) → PLACE lên BĂNG TẢI (điểm cố định này).
# [MEASURE] đo điểm đặt trên băng tải khi lắp cell; giá trị dưới là placeholder.
place_position: [700.0, 120.0, 700.0]   # [MEASURE] điểm đặt cố định trên băng tải, phải trong tầm với

# ───── Tham số chuyển động (tinh chỉnh ở pha tuning — mục 9) ─────
approach_height_mm: 200.0       # lift_T Z = grasp_Z + 200 → MoveL xuống thẳng đứng từ cao, IK pick elbow-up clean
return_home_after_success: true # về home sau mỗi success → trial kế APPROACH từ trên cao xuống tự nhiên (video demo đẹp)
speed_joint_deg_s: 60.0         # tốc độ joint
speed_linear_mm_s: 80.0         # tốc độ linear
yaw_offset_deg: 90.0            # 90°: gripper jaws spread vuông góc PCA major axis → kẹp chiều rộng tray (Y, 100mm) thay vì chiều dài (X, 180mm)

# ───── Gripper ─────
gripper_do_index: 10            # chỉ số Digital Output điều khiển gripper (OT#10 trên YRC1000)
# gripper_delay_s: fallback blind delay khi KHÔNG có CC-Link sensor feedback
# (sim/headless, hoặc real chưa wire sensor). Real chain PC → YRC → PLC
# Mitsubishi → solenoid → pneumatic total ~150-415ms tùy hardware. 0.5s an toàn.
# Tăng nếu PLC scan time chậm hoặc pneumatic cylinder lớn.
gripper_delay_s: 0.5

# ───── Gripper CC-Link (Path A — double-acting + sensor feedback) ─────
# Gripper khí nén điều khiển qua PLC Mitsubishi, PC ↔ PLC qua YRC1000 làm
# CC-Link bridge (set_io/read_io absolute bit). Khi block này active,
# orchestrator dùng _gripper_cc_link(): toggle solenoid → chờ position sensor
# → (close) verify detect sensor, thay vì blind delay.
#
# --mode real TỰ ĐỘNG bật block dưới với mapping mặc định (xem
# scripts/03_run_experiment.py). Bỏ comment ở đây để OVERRIDE nếu bit address
# trên YRC TP khác (Setup → I/O Module → CC-Link). Chi tiết: docs §7.9 +
# HUONG_DAN_CAI_DAT §2.9 Bước 4.
#
# Sim/headless: GIỮ comment (= None) → dùng blind-delay đơn giản ở trên.
# gripper_cc_link:
#   clamp_bit:               30010   # OUT → PLC Y502 (Clamp solenoid)
#   unclamp_bit:             30011   # OUT → PLC Y503 (UnClamp solenoid)
#   clamp_sensor_bit:        30050   # IN  ← PLC X504 (cylinder tại vị trí Clamp)
#   unclamp_sensor_bit:      30051   # IN  ← PLC X503 (cylinder tại vị trí UnClamp)
#   detect_bit:              30052   # IN  ← PLC X505 (Carrier Detect — có vật trong gripper)
#   wait_sensor_timeout_s:   2.0     # timeout chờ position sensor ON → raise gripper_timeout
#   wait_sensor_poll_s:      0.05    # chu kỳ poll sensor (giây)
#   require_detect_on_close: true    # sau close, verify detect ON → raise grasp_failed nếu OFF

# ───── Điều phối ─────
inter_trial_delay_s: 1.0        # nghỉ giữa các trial
detection_timeout_s: 2.0        # thời gian chờ detection tối đa

# ───── Perception (mode real) ─────
# Checkpoint E2 hiện có: seed 1, được chọn trước đây theo validation mask mAP.
# Chưa xác nhận lại lựa chọn này theo điểm composite box+mask của protocol mới.
# Bản cục bộ trùng _work/ket_qua_E2/runs/seed1/weights/best.pt theo SHA-256.
model_path: "models/e2_seed1_best.pt"
conf_threshold: 0.5

# ───── Robot thật (mode real) ─────
robot_ip: "192.168.1.100"       # IP YRC1000

# ───── Tham số RIÊNG cho --mode real (cell thật, 5 vật của paper) ─────
# 03_run_experiment.py gộp khối này đè lên các khóa phía trên CHỈ khi --mode real, nên
# mô phỏng (khay, chai, cốc, bu lông) giữ nguyên hành vi cũ.
real:
  # Hàm kẹp mở 180 mm (đóng hết) tới 216 mm (mở hết), không đệm. Mỗi vật chỉ kẹp được
  # theo cạnh 180 đến 190 mm của nó, tức dọc trục chính của mặt nạ, nên góc lệch là 0.
  # Giá trị 90 ở trên là cho khay S23 (kẹp chiều rộng 100 mm) với bộ kẹp trước đây.
  yaw_offset_deg: 0.0
  # Mặt bàn, trong ĐÚNG hệ tọa độ của T_base_camera. Để null: 02_run_calibration.py đo
  # mặt bàn từ depth qua chính T_BC vừa giải và ghi config/calibration/table_plane.json,
  # chế độ real đọc từ đó. Chỉ gõ tay khi biết chắc con số nằm trong hệ của T_BC.
  table_top_z_mm: null
  # Đầu má kẹp không xuống thấp hơn mặt bàn cộng khoảng này, và không kẹp sâu hơn chiều
  # cao vật trừ khoảng này. [XÁC NHẬN theo má kẹp thật; để lớn khi chạy thử lần đầu]
  table_safety_margin_mm: 20.0
  # Độ sâu kẹp tối đa tính từ mặt trên của vật. [XÁC NHẬN theo má kẹp thật]
  grasp_depth_offset_mm: 50.0
  # Chiều cao từng lớp theo thước kẹp (2026-09-11). Carton có hai cỡ, cao 120 và 80 mm:
  # lấy 80 để má kẹp không vượt đáy vật với cả hai cỡ; độ sâu vẫn bị chặn ở 50 mm.
  class_heights_mm:
    carton: 80.0
    plastic_box: 30.0
    wood_box: 150.0
    metal_box: 85.0
    inox_box: 40.0
  # Kích thước (dài, rộng, cao) theo thước kẹp, cho chế độ độ sâu plane và fusion (C4).
  # Lớp có hai cỡ (carton) được phân biệt theo từng vật: mỗi cỡ được đặt lên mặt bàn và
  # chiếu vào ảnh, cỡ nào có bóng khớp mặt nạ nhất (IoU) thì chọn, và chiều cao của cỡ đó
  # thay cho 80 mm ở trên. Chiều cao thấp nhất của mỗi lớp phải bằng class_heights_mm
  # (preflight kiểm tra).
  class_sizes_mm:
    carton: [[180, 120, 120], [180, 100, 80]]
    plastic_box: [[180, 140, 30]]
    wood_box: [[190, 190, 150]]
    metal_box: [[190, 135, 85]]
    inox_box: [[180, 85, 40]]
