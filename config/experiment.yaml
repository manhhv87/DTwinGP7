# =============================================================================
# experiment.yaml — Cấu hình thí nghiệm pick-and-place
# =============================================================================
# Dùng bởi scripts/05_run_experiment.py. Các key dưới được nạp trực tiếp vào
# Orchestrator (xem src/orchestrator/orchestrator.py :: _DEFAULT_CONFIG).
# =============================================================================

# ───── Robot + calibration ─────
robot_name: "Yaskawa GP7"
calibration_path: "config/calibration/T_base_camera.npy"

# ───── Vùng đặt vật (base frame, mm) ─────
place_position: [700.0, 200.0, 700.0]   # Z=700 (cao hơn mặt bàn 200mm) để fingertip (TCP) không chạm bàn khi thả

# ───── Tham số chuyển động (tinh chỉnh ở pha tuning — mục 9) ─────
approach_height_mm: 150.0       # lift_T Z = grasp_Z + 150 → arm vào grasp từ phía trên cao, tránh xuyên bottle
return_home_after_success: true # về home sau mỗi success → trial kế APPROACH từ trên cao xuống tự nhiên (video demo đẹp)
speed_joint_deg_s: 60.0         # tốc độ joint
speed_linear_mm_s: 80.0         # tốc độ linear
yaw_offset_deg: 0.0             # bù lệch yaw PCA ↔ trục mở gripper

# ───── Gripper ─────
gripper_do_index: 1             # chỉ số Digital Output điều khiển gripper
gripper_delay_s: 0.3            # chờ gripper đóng/mở ổn định

# ───── Điều phối ─────
inter_trial_delay_s: 1.0        # nghỉ giữa các trial
detection_timeout_s: 2.0        # thời gian chờ detection tối đa

# ───── Perception (mode real) ─────
model_path: "models/yolov8s-seg_best.pt"
conf_threshold: 0.5

# ───── Robot thật (mode real) ─────
robot_ip: "192.168.1.100"       # IP YRC1000
