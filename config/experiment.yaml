robot_name: Yaskawa GP7
calibration_path: config/calibration/T_base_camera.npy
class_pick_z_bias_mm:
  plastic_box: 10.0
place_position:
- 500.0
- -350.0
- 150.0
# Sau mỗi chuyển động Cartesian, đọc góc khớp rồi dựng lại vị trí đầu công tác và
# so với đích. Lệch quá ngưỡng này thì dừng lượt. Đặt 0 để tắt phép kiểm.
move_verify_tol_mm: 5.0
approach_height_mm: 100.0
return_home_after_success: false
speed_joint_deg_s: 60.0
speed_linear_mm_s: 80.0
yaw_offset_deg: 90
gripper_do_index: 10
gripper_delay_s: 0.5
inter_trial_delay_s: 1.0
detection_timeout_s: 2.0
model_path: models/e2_seed1_best.pt
conf_threshold: 0.5
robot_ip: 192.168.125.100
real:
  yaw_offset_deg: 5.0
  table_top_z_mm: null
  table_safety_margin_mm: 20.0
  grasp_depth_offset_mm: 0.0
  # Reject RGB-D target-height estimates that differ too far from the
  # measured physical variants in class_sizes_mm.
  place_height_tolerance_mm: 20.0
  class_heights_mm:
    carton: 80.0
    plastic_box: 30.0
    wood_box: 150.0
    metal_box: 85.0
    inox_box: 40.0
  class_sizes_mm:
    carton:
    - - 180
      - 120
      - 120
    - - 180
      - 100
      - 80
    plastic_box:
    - - 180
      - 140
      - 30
    wood_box:
    - - 190
      - 190
      - 150
    metal_box:
    - - 190
      - 135
      - 85
    inox_box:
    - - 180
      - 85
      - 40
  place_yaw_deg: 5.3
