# =============================================================================
# Cell Layout Configuration cho hệ thống pick-and-place GP7
# =============================================================================
# File này mô tả toàn bộ cell mô phỏng. RoboDK Free không lưu được .rdk,
# nên chúng ta dùng file YAML này + script build_station.py để tái tạo cell
# mỗi lần mở RoboDK.
#
# Workflow:
#   1. Sửa file này nếu cần thay đổi cell
#   2. Chạy: python scripts/build_station.py
#   3. Cell xuất hiện trong RoboDK GUI sau 3-5 giây
#
# Validation: dùng Pydantic schema, sai field sẽ báo lỗi ngay
#   python -m src.cell.cell_models validate config/cell_layout.yaml
# =============================================================================

metadata:
  version: "1.0.0"
  last_modified: "2025-01-15"
  author: "Master Thesis - GP7 Pick Place"
  notes: |
    Base config cho simulation mode.
    Camera đặt ở 700mm trên bàn (eye-to-hand, sweet spot D455).
    3 loại vật: bottle, cup, bolt.


# ─────────────────────────────────────────────────────────────────────────────
# ROBOT
# ─────────────────────────────────────────────────────────────────────────────
robot:
  name: "Yaskawa GP7"
  source: "library"                       # "library" hoặc "file"
  library_name: "Yaskawa-GP7.robot"       # tên file trong C:/RoboDK/Library/

  # Pose của base robot trong World frame của RoboDK.
  # Yaskawa-GP7.robot library: origin item TRÙNG với J1 axis, còn mesh stand
  # built-in được vẽ ĐI XUỐNG dưới origin (~330mm — đo được qua trial-error).
  # pose.z = 630 → đáy stand ở Z=300 = đỉnh pedestal.stl → robot đứng trên
  # pedestal. J1 ở Z=630, cao hơn mặt bàn (Z=500) 130mm cho top-down picking.
  pose:
    xyz_mm: [0, 0, 630]                   # J1 trên đỉnh pedestal + stand built-in
    rpy_deg: [0, 0, 0]

  # Cấu hình joints "home" (tư thế rest/transport)
  # Yaskawa GP7 convention: [S, L, U, R, B, T]
  # S=0: arm hướng về +X (về phía bàn). L=30°, U=-60°: tư thế "elbow up"
  # → arm tránh đụng workpiece khi với xuống. B=60°: wrist hướng xuống sẵn
  # cho top-down picking → SolveIK ưu tiên config sạch không xuyên vật.
  # Tinh chỉnh tự động: chạy scripts/set_home_pose.py (cần RoboDK GUI).
  home_joints_deg: [1.97, 2.26, -4.99, -181.93, 41.7, -90.35]   # capture từ RoboDK GUI (save_current_as_home.py)


# ─────────────────────────────────────────────────────────────────────────────
# FLOOR (sàn nhà — mặt phẳng tham chiếu cho cả cell, mặt trên tại Z=0)
# ─────────────────────────────────────────────────────────────────────────────
floor:
  mesh: "models/floor.stl"                # tấm 3000×3000 mm, mặt trên ở Z=0
  pose:
    xyz_mm: [300, 0, 0]                   # phủ dưới cả robot (X=0) lẫn bàn (X=480)
    rpy_deg: [0, 0, 0]
  color_rgb: [0.82, 0.82, 0.86]           # xám nhạt


# ─────────────────────────────────────────────────────────────────────────────
# WORKTABLE (bàn làm việc)
# ─────────────────────────────────────────────────────────────────────────────
worktable:
  mesh: "models/worktable.stl"            # bàn 600×400×500 mm, origin ở đáy chân bàn (Z=0 = sàn)

  pose:
    xyz_mm: [700, 0, 0]                   # center bàn X=700 → mép trước X=400 (clearance ~215mm với robot base ⌀370mm)
    rpy_deg: [0, 0, 0]

  color_rgb: [0.6, 0.6, 0.7]              # màu xám-xanh nhẹ


# ─────────────────────────────────────────────────────────────────────────────
# ROBOT PEDESTAL — nâng robot lên cao hơn bàn cho top-down picking tự nhiên
# pedestal.stl: 300×300×300mm, origin ở đáy → chạm sàn khi pose.z=0
# Robot stand built-in (~350mm) sẽ ngồi trên đỉnh pedestal (Z=300)
# ─────────────────────────────────────────────────────────────────────────────
robot_pedestal:
  mesh: "models/pedestal.stl"
  pose:
    xyz_mm: [0, 0, 0]                     # chạm sàn, dưới robot
    rpy_deg: [0, 0, 0]
  color_rgb: [0.4, 0.4, 0.4]


# ─────────────────────────────────────────────────────────────────────────────
# CAMERA MOUNT (giàn lắp camera)
# ─────────────────────────────────────────────────────────────────────────────
camera_mount:
  mesh: "models/camera_mount.stl"         # optional, có thể bỏ
  pose:
    xyz_mm: [700, 0, 500]                 # đứng trên mặt bàn (Z=500)
    rpy_deg: [0, 0, 0]


# ─────────────────────────────────────────────────────────────────────────────
# CAMERA (D455 ảo trong RoboDK, cho visualization)
# ─────────────────────────────────────────────────────────────────────────────
camera:
  type: "virtual"                         # "virtual" = Camera trong RoboDK
  model: "Intel RealSense D455"

  pose:
    xyz_mm: [700, 0, 1200]                # 700 mm trên mặt bàn (sweet spot D455 0.6-2m)
    rpy_deg: [180, 0, 0]                  # hướng nhìn xuống

  intrinsics:
    fov_deg: 87                           # FOV ngang của D455 RGB
    focal_length_mm: 1.93                 # tiêu cự D455
    size_px: [1280, 720]                  # độ phân giải


# ─────────────────────────────────────────────────────────────────────────────
# GRIPPER (end-effector tool)
# ─────────────────────────────────────────────────────────────────────────────
gripper:
  name: "TwoFingerGripper"
  mesh: "models/gripper.stl"              # parallel-jaw, opening 90mm, cao 110mm

  # TCP offset từ flange của robot — đặt ngay tại fingertip để pose grasp
  # tương đương "đầu ngón chạm bề mặt vật".
  # Tổng cao gripper = palm_height(40) + finger_length(50) = 90mm.
  tcp_offset_xyz_mm: [0, 0, 90]
  tcp_offset_rpy_deg: [0, 0, 0]


# ─────────────────────────────────────────────────────────────────────────────
# REFERENCE FRAMES (hệ tọa độ tham chiếu)
# ─────────────────────────────────────────────────────────────────────────────
frames:
  - name: "WorkpieceArea"
    pose:
      xyz_mm: [700, 0, 500]               # giữa mặt bàn (Z=500), vùng pick — reach ~712mm từ J1
      rpy_deg: [0, 0, 0]

  - name: "PlaceZone"
    pose:
      xyz_mm: [700, 120, 500]             # mirror của bottle pick Y=-120 → bottle 68mm hoàn toàn trong bàn (Y range -200..+200)
      rpy_deg: [0, 0, 0]

  - name: "CalibrationTarget"             # cho hand-eye calibration
    pose:
      xyz_mm: [700, 0, 510]               # trên mặt bàn 10 mm
      rpy_deg: [0, 0, 0]


# ─────────────────────────────────────────────────────────────────────────────
# OBJECT TEMPLATES (3 loại vật)
# ─────────────────────────────────────────────────────────────────────────────
# Các vật này được load làm template, mặc định ẩn (visible: false)
# Khi thí nghiệm, code orchestrator sẽ clone hoặc show theo nhu cầu
# Pose của object là OFFSET so với parent_frame (WorkpieceArea = (700, 0, 500)).
# Spread theo Y để 3 vật không chồng nhau; bolt rất nhỏ (9×8×24mm) — không
# chia ô Y trùng vật khác nếu không sẽ khuất.
objects:
  - name: "bottle"
    mesh: "models/objects/bottle.stl"
    visible: false
    parent_frame: "WorkpieceArea"
    pose:
      xyz_mm: [0, -120, 0]                 # world (700, -120, 500)
      rpy_deg: [0, 0, 0]

  - name: "cup"
    mesh: "models/objects/cup.stl"
    visible: false
    parent_frame: "WorkpieceArea"
    pose:
      xyz_mm: [0, 0, 0]                    # world (700, 0, 500) — giữa bàn
      rpy_deg: [0, 0, 0]

  - name: "bolt"
    mesh: "models/objects/bolt.stl"
    visible: false
    parent_frame: "WorkpieceArea"
    pose:
      xyz_mm: [0, 120, 0]                  # world (700, 120, 500)
      rpy_deg: [0, 0, 0]


# ─────────────────────────────────────────────────────────────────────────────
# ROBOT CONNECTION (online mode - kết nối GP7 thật)
# ─────────────────────────────────────────────────────────────────────────────
# Mặc định enabled=false (sim mode).
# Khi đến phase test với GP7 thật, đổi enabled=true.
robot_connection:
  enabled: false
  ip: "192.168.1.100"                     # IP của YRC1000
  port: 80                                # default port cho RoboDK Motoman driver
  driver: "Motoman"
