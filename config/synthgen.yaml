# =============================================================================
# synthgen.yaml — Cấu hình sinh dữ liệu synthetic (C2: calibration-anchored DR)
# =============================================================================
# Dùng bởi scripts/20_generate_synth.py qua src/synthgen/anchored_config.py.
#
# NGUYÊN TẮC (khớp Eq. (1) + Table "factors" trong paper):
#   - Factor "anchored": phân phối TÂM tại giá trị hiệu chuẩn/đo được của cell,
#     độ rộng = κ·σ. σ ưu tiên lấy từ config/calibration/T_base_camera_sigma.json
#     (bootstrap — scripts/02_run_calibration.py --bootstrap 200); các giá trị
#     sigma_* dưới đây chỉ là FALLBACK khi chưa có file đó.
#   - Factor "free": rút NHƯ NHAU ở CẢ hai chế độ anchored lẫn blind, ở mọi κ và mọi nhánh
#     E5. Gồm biến nhiệm vụ (pose vật, số vật) và các factor mà hiệu chuẩn lẫn phép đo
#     không chốt được, rút trong biên vật lý hoặc biên được bước kiểm chấp nhận: độ lợi phơi
#     sáng (mục exposure), chỗ treo đèn, cách các đèn chia ánh sáng và phần ánh sáng của nền
#     trên cao (mục lighting).
#   - Hai recipe CHỈ khác nhau ở factor đo được: extrinsic (và nội tại) camera, mức sáng và màu
#     đèn quanh profile khớp, màu bàn, diện mạo vật; wide-range rộng hơn anchored ở mọi κ.
#   - Chế độ --mode blind: biên rộng cố định ở các khóa blind_* và recipe vật liệu
#     khác; vẫn dùng CÙNG camera reference T_BC và intrinsics. Vì vậy đây không phải
#     đối chứng độc lập với calibration hoặc chỉ khác một nguồn uncertainty.
# =============================================================================

camera:
  # Anchor nội tại: số ĐO của chính camera trên cell, đọc từ T_base_camera_meta.json của
  # lần hiệu chuẩn 18/09/2026 (D455 serial 241122301774, luồng màu 1280x720).
  intrinsics:
    fx: 645.007
    fy: 644.202
    ppx: 647.286
    ppy: 368.784
    width: 1280
    height: 720
  # Fallback σ khi chưa có T_base_camera_sigma.json (đơn vị mm / deg / px)
  sigma_trans_mm: [2.0, 2.0, 2.0]
  sigma_rot_deg: [0.5, 0.5, 0.5]
  sigma_intrinsics_px: 2.0
  # Blind: dải rộng cố định (uniform ±)
  blind_trans_mm: 100.0
  blind_rot_deg: 10.0
  blind_intrinsics_px: 30.0

lighting:
  # Ánh sáng của ĐIỀU KIỆN KHÓ (mọi lượt E3-E5): các đèn tấm 600 mm phía trên cell (đèn vùng của
  # Blender, mặt gương thấy được) cộng một nền trên cao đồng đều có tông màu (world của Blender);
  # hard_profile.luminaire_lights dựng chúng. Mô hình lấy từ mặt gương hộp inox trên ảnh train
  # (118 lần xuất hiện, ánh sáng chuẩn): một đèn bão hòa có cỡ góc của tấm 600 x 630 mm ở 1850 mm
  # trên bàn; phần trên cao ngoài đèn sáng 0,27 lần mặt bàn, tông (0,886, 1, 0,852). Ở điều kiện
  # khó các đèn trên cell tắt: vạch đen không phản chiếu đèn nào, gương inox không bao giờ bão
  # hòa, phần bàn xa sáng hơn vùng thẻ 1,5-1,8 lần (chuẩn 0,6-0,9), nên nguồn còn lại ở phía xa
  # bàn. Vị trí của nó và phần ánh sáng của nền trên cao KHÔNG đo được từ ảnh có sẵn (báo cáo
  # nghiên cứu kim loại 05/11/2026).
  #
  # Factor ĐO ĐƯỢC, anchored quanh profile và wide-range rộng hơn ở MỌI κ: mức sáng, màu đèn, tông
  # nền trên cao. Factor TỰ DO, rút như nhau ở hai recipe, mọi κ và mọi nhánh E5 (kể cả nhánh
  # illumination), vì không phép đo nào chốt được chúng: chỗ treo đèn, cách các đèn chia ánh
  # sáng, phần ánh sáng của nền trên cao (cùng độ lợi phơi sáng, mục exposure). Nhánh E5
  # illumination chỉ cố định mức sáng và màu ở profile.
  #
  # Điều kiện mà mức sáng được khớp: nhãn --lighting của lượt thử (mọi lượt E3-E5 ghi dim).
  # Nhãn khác bị từ chối (anchored_config.LIGHTING_CONDITION_SCALE chỉ có dim).
  anchor_condition: dim
  # MỨC SÁNG: độ rọi (trọng số độ chói, đơn vị render) tại tâm khối thẻ reference_point_mm trên mặt
  # bàn; nền trên cao mang một phần, các đèn phần còn lại. KHỚP ngày 05/11/2026 bằng scripts/
  # fit_hard_profile.py ở bố trí danh định (một đèn ở giữa các khoảng dưới, x 1950, y -50, cao
  # 1850 mm; phần trên cao 0,487, trung bình nhân của khoảng): ảnh render bàn trống cho độ sáng
  # thẻ của bước kiểm điều kiện (trung vị luma các ô 32 px vùng thẻ) bằng trung bình hai buổi
  # e2kho-1 (90,4) và e2kho-2 (104,0) lấy trong ánh sáng tuyến tính, 97,5. Thẻ mang albedo nối với
  # thang màu vật (background.standard_table_rgb).
  # Số cũ 11,15 W mỗi đèn điểm (hai đèn proxy ở 1800 mm): mô hình khác, không so được.
  # ⚠ D455 chụp ở chế độ TỰ ĐỘNG phơi sáng: đây là khớp với thứ camera xuất ra ở trạng thái của
  #   bước kiểm (sensor.gain = 1), không phải độ rọi thật tính bằng lux.
  anchor_irradiance: 1.0707
  reference_point_mm: [572.7, 20.0]
  anchor_color_temp_k: 5000.0
  # Anchored: mức sáng = anchor_irradiance × exp(η), η ~ N(0, (κ·0,20)²), nên luôn dương; nhiệt độ
  # màu mỗi đèn 5000 K + N(0, (κ·300)²); tông nền trên cao × exp(N(0, (κ·0,04)²)) từng kênh.
  sigma_intensity_frac: 0.20
  sigma_color_temp_k: 300.0
  overhead_tint_rgb: [0.886, 1.0, 0.852]
  sigma_overhead_tint: 0.04
  # Tự do: tấm 600 x 600 mm, cao 1700-2000 mm trên mặt bàn (đều). Một đèn ở x 1100-2800, y -500..400
  # mm (phía xa bàn: bản đồ độ rọi của ảnh 29/10 dưới đèn khó tăng về phía xa, không chốt được
  # nguồn), thêm với xác suất 0,5 một đèn bất kỳ ở x 0-2800, y -1500..1500; các đèn chia phần ánh
  # sáng không đến từ trên cao theo Dirichlet(1, ..., 1).
  luminaire_size_mm: [600.0, 600.0]
  luminaire_height_mm: [1700.0, 2000.0]
  far_luminaire_x_mm: [1100.0, 2800.0]
  far_luminaire_y_mm: [-500.0, 400.0]
  extra_luminaire_probability: 0.5
  extra_luminaire_x_mm: [0.0, 2800.0]
  extra_luminaire_y_mm: [-1500.0, 1500.0]
  # Phần độ rọi tại thẻ do nền trên cao mang, log-đều: 0,25 (phòng mờ cùng cell) đến 0,95 (chỉ tắt
  # đèn cell, phòng giữ nguyên); điều kiện chuẩn đo được 0,33. Đây là biên VẬT LÝ; khoảng này và
  # đèn thứ hai được chọn sau khi xem ứng viên trước đó trên tập kiểm chứng, không số nào khớp vào
  # ảnh kiểm chứng (báo cáo kim loại, mục 7), nên bài không được nói khoảng đặt mù.
  overhead_share_range: [0.25, 0.95]
  # Wide-range: mức sáng = anchor_irradiance × f, f log-đều trong khoảng này. Tâm log là 1 vì mức
  # sáng nay chính là độ rọi tại thẻ (khoảng cũ 0,033-2,7 có tâm 0,3 để bù 1-4 đèn điểm thấp hơn
  # đèn neo); ln(P95/P5) 3,95 so với 2,63 của anchored κ = 4. Màu mỗi đèn đều trong khoảng nhiệt độ
  # màu; tông nền trên cao exp(U(-0,5, 0,5)) từng kênh, không dùng số đo.
  blind_intensity_rel_range: [0.111, 9.0]
  blind_color_temp_range_k: [2500.0, 9000.0]
  blind_overhead_tint_log: 0.5

background:
  # Mọi màu trong file này là giá trị sRGB 8 bit đo được chia 255 (mã hóa sRGB, KHÔNG tuyến
  # tính); renderer đổi sang tuyến tính trước khi đưa vào Base Color của Blender. Trước
  # 11/2026 nó đưa thẳng giá trị sRGB vào, nên màu tối ra sáng gấp nhiều lần (hộp nhựa
  # render (43, 83, 100) so với đo (8, 38, 57)).
  #
  # Bàn xám trần ở điều kiện chuẩn, ĐO ngày 12/09/2026 trên 16 ảnh bàn trống (vùng giữa mặt
  # bàn): sRGB trung vị (150, 151, 150), độ lệch giữa các ảnh 0,049. Mọi màu vật trong
  # objects.materials đo trên cùng loại ảnh đó, nên bàn này là GỐC THANG ALBEDO: dưới ánh
  # sáng làm bàn ra đúng (150, 151, 150), mỗi vật ra đúng màu đo của nó. Không thí nghiệm
  # E3-E5 nào chạy trên mặt bàn trần, nên renderer không dùng số này; scripts/
  # fit_hard_profile.py dùng nó để nối thang của thẻ trắng (xem hard_profile.cards).
  standard_table_rgb: [0.588, 0.592, 0.588]
  # MÀU TẤM NỀN XANH phía trên vạch đen (nửa bàn đặt vật) của điều kiện khó: sampler rút
  # màu bàn của mọi cảnh quanh số này; nửa bàn phía dưới vạch theo
  # hard_profile.table.lower_sheet_ratio. KHỚP ngày 05/11/2026 bằng scripts/
  # fit_hard_profile.py trên hai ảnh bàn trống của bước kiểm điều kiện
  # (results/e2kho-1/do_sang_e2kho-1.png 02/11, results/e2kho-2/do_sang_e2kho-2.png 03/11):
  # ảnh render bàn trống cho trung vị màu các ô 32 px của nửa trên bằng trung bình hai buổi
  # lấy trong ánh sáng tuyến tính, sRGB (13,7, 23,9, 16,2) trên 255. Hai buổi cho tỉ lệ G
  # 0,449 và 0,453, độ sáng 17,7 và 22,1; ảnh khớp cho 0,444 và 20,0. Khớp dưới ánh sáng danh định
  # của mục lighting (đèn tấm phía xa cộng nền trên cao); bản đèn điểm trước đó cho (0,1172, 0,1851,
  # 0,1374).
  # Số cũ [0.590, 0.592, 0.588] là bàn trần chuẩn ở trên, đưa vào như thể tuyến tính.
  anchor_albedo_rgb: [0.1137, 0.1845, 0.1414]
  # Độ lệch giữa các ảnh, giữ TỈ LỆ của điều kiện chuẩn: 0,049 trên màu trung bình 0,59 là
  # 0,083 lần màu; sampler chia sigma_albedo cho trung bình anchor_albedo_rgb (0,1466), nên
  # 0,083 x 0,1466. Hai ảnh kiểm điều kiện khó chỉ là một cặp, không đủ ước độ lệch riêng.
  sigma_albedo: 0.0122
  # Không còn tác dụng: các mặt phẳng tĩnh render khuếch tán thuần (renderer bỏ lớp phản xạ
  # gương), vì độ sáng của chúng được khớp như một khối. Giữ khóa cho schema của sampler.
  anchor_roughness: 0.8
  # Wide-range: mỗi kênh đều trong khoảng này. Là giá trị mã hóa sRGB, nên khoảng đã bao
  # màu tấm nền khớp ở trên (tuyến tính 0,004-0,89 mỗi kênh).
  blind_albedo_range: [0.05, 0.95]

objects:
  # class_name → mesh (đường dẫn tương đối repo root). 5 hộp của bộ dữ liệu paper.
  #
  # THỨ TỰ NÀY LÀ CHUẨN — phải khớp với auto_label.DEFAULT_CLASS_NAMES và
  # dataset_check.EXPECTED_NAMES. Lệch thứ tự thì mô hình vẫn train được nhưng
  # tráo lớp lúc chạy; dataset_check tồn tại chính là để bắt lỗi đó.
  #
  # Mesh dựng bằng scripts/gen_product_meshes.py theo KÍCH THƯỚC ĐO BẰNG THƯỚC KẸP
  # (dài × rộng × cao, mm), đo ngày 2026-09-11:
  #     carton (2 cỡ) 180×120×120 và 180×100× 80
  #     plastic_box   180×140× 30     wood_box   190×190×150
  #     metal_box     190×135× 85     inox_box   180× 85× 40
  # Lớp carton gồm hai hộp thật khác cỡ nên nhận DANH SÁCH mesh; bộ sinh cảnh chọn
  # một cỡ cho mỗi lần đặt vật, cả hai đều mang nhãn carton. Chiều cao ở đây nuôi
  # thẳng chế độ plane của C4 (z_from_ground_plane), nên sai mesh là sai điểm kẹp.
  #
  # Sim/demo còn dùng bộ bottle/cup/bolt/tray riêng (detector.DEFAULT_CLASS_NAMES)
  # — KHÔNG liên quan ở đây.
  classes:
    carton:      ["models/objects/carton_large.stl", "models/objects/carton_small.stl"]
    plastic_box: "models/objects/plastic_box.stl"
    wood_box:    "models/objects/wood_box.stl"
    metal_box:   "models/objects/metal_box.stl"
    inox_box:    "models/objects/inox_box.stl"
  class_ids:
    carton: 0
    plastic_box: 1
    wood_box: 2
    metal_box: 3
    inox_box: 4
  # Kích thước [dài, rộng, cao] mm của từng mesh, đúng số thước kẹp ở trên (dài theo trục X
  # của mesh, đáy ở z = 0; test so với file STL). Dùng cho phép kiểm chồng hình chữ nhật xoay
  # và cho độ cao mặt trên của vật đỡ khi xếp chồng.
  mesh_sizes_mm:
    models/objects/carton_large.stl: [180.0, 120.0, 120.0]
    models/objects/carton_small.stl: [180.0, 100.0, 80.0]
    models/objects/plastic_box.stl:  [180.0, 140.0, 30.0]
    models/objects/wood_box.stl:     [190.0, 190.0, 150.0]
    models/objects/metal_box.stl:    [190.0, 135.0, 85.0]
    models/objects/inox_box.stl:     [180.0, 85.0, 40.0]
  # Số CHỖ ĐẶT trên bàn mỗi cảnh: một vật, hoặc một vật đỡ có vật khác nằm trên (xếp chồng
  # tính là một chỗ). Hình chiếu đáy các chỗ đặt không chồng nhau. Vùng tâm vật bên dưới
  # đã bằng đúng lưới thẻ cộng dung sai 15 mm (sâu 130 mm theo x) nên không nới được mà vẫn
  # giữ hình học của phép thử thật. Đo trên 3000 cảnh, 200 lần rút cho mỗi chỗ đặt: với ba
  # chỗ, 28,5% chỗ thứ hai và thứ ba không tìm được tư thế trống và chỉ 43% cảnh đủ ba; với
  # hai chỗ, 0,4% chỗ thứ hai bị bỏ. Nên giới hạn ở hai. Lượt gắp thật có đúng một chỗ đặt
  # (một vật hoặc một cặp chồng).
  count_range: [1, 2]
  # Lớp của vật THỨ NHẤT và vật đỡ của nó: đếm trên tư thế 1-200 của
  # config/pose_lists/hard_v2.csv và std_v2.csv (hai danh sách trùng nhau từng dòng về
  # class_hint và stack_on; test đếm lại từ hai file). single = số dòng không chồng,
  # stacked_on = số dòng theo lớp vật đỡ (vật đỡ đặt lên thẻ trước, vật được gọi nằm trên).
  # Tổng 200 dòng: inox 100 (50%), mỗi lớp khác 25; 40 dòng xếp chồng (20%). Các vật sau
  # vật thứ nhất vẫn chọn lớp đều. Cỡ carton chọn đều 50/50 ở mọi vai, như file
  # <list>_carton.csv (scripts/28_make_carton_sizes.py chia đôi cỡ trong từng nhóm vai).
  first_object_mix:
    carton:      {single: 21, stacked_on: {plastic_box: 4}}
    plastic_box: {single: 19, stacked_on: {wood_box: 6}}
    wood_box:    {single: 20, stacked_on: {metal_box: 5}}
    metal_box:   {single: 21, stacked_on: {inox_box: 4}}
    inox_box:    {single: 79, stacked_on: {plastic_box: 5, metal_box: 5, carton: 5, wood_box: 6}}
  # Tâm vật nằm trên lệch tâm vật đỡ tối đa ngần này mỗi trục: dung sai đặt vật ±15 mm
  # (HUONG_DAN_THI_NGHIEM_CELL_THAT.md, B1). Góc của vật đỡ không được gọi trong phép thử
  # nên chọn độc lập.
  stack_offset_mm: 15.0
  # Vùng ĐẶT VẬT (placement envelope): nơi đặt vật khi gắp thật, dùng chung cho ba chỗ:
  # lưới thẻ (22_make_pose_lists.py, lề 15 mm = dung sai đặt vật), ô chia lỗi của vòng C3
  # (21_mine_failures.py) và vị trí vật trong ảnh tổng hợp.
  # Tính từ hiệu chuẩn tay-mắt 18/09/2026 (camera tại x = 638.6 mm sau khi bù phép chạm thử
  # 24/09/2026, cách bàn 712.7 mm), GIỮ
  # NGUYÊN camera và dataset. Hai giới hạn kẹp nhau:
  #   - phía gần robot: dưới x ~ 510, vật cao và chồng hai lớp (tới 235 mm) bị cắt ở mép ảnh;
  #   - phía xa: trên x ~ 640, tư thế tiếp cận 200 mm trên chồng 235 mm vượt tầm với GP7 khi
  #     dụng cụ dài 180-190 mm (người dùng báo mặt bích tới mặt dưới kẹp ~180 mm, 21/09/2026).
  # Đã kiểm mọi lớp, mọi kiểu chồng, mọi góc 5 độ, cộng dung sai ±15 mm: lề ảnh nhỏ nhất 8,6 px
  # (14 px trước khi bù phép chạm thử 24/09/2026; nadir camera dịch ra xa robot 4 mm), ở thẻ
  # (525, −160). IK giải hết cho cả 300 tư thế của hai danh sách với dụng cụ 178 mm đo được
  # ngày 24/09/2026, và với 180 mm. Dataset: 50-65% vật của từng lớp, ở cả bốn tập
  # train/val/test chuẩn/test khó, nằm ở x >= 510, nên vùng này nằm trong phân bố ảnh thật.
  # Số cũ 277..562 x ±390 suy từ một mô hình camera ước lượng trước khi có hiệu chuẩn, sai ~100 mm.
  region_x_mm: [510.0, 640.0]
  region_y_mm: [-175.0, 215.0]
  table_z_mm: 593.9              # đỉnh mặt bàn, world frame: z_top_mm của table_plane.json 18/09/2026
  yaw_range_deg: [-90.0, 90.0]

  # Diện mạo từng lớp. KHÔNG có khối này thì mọi vật render ra màu xám trắng như
  # nhau, và dữ liệu tổng hợp không dạy detector được gì về màu sản phẩm.
  #
  # Lớp ĐIỆN MÔI (carton, nhựa, gỗ): albedo_rgb là màu trong thang albedo của file này (bàn chuẩn
  # trần 0,305 tuyến tính), cộng lớp phản xạ gương điện môi F0 0,04 mà renderer nhân
  # render.reflectance_scale.
  # DIỆN MẠO CẢ NĂM LỚP (albedo_rgb của điện môi, f0_rgb của kim loại) KHỚP ngày 06/11/2026 trên khung
  # lượt gắp E2 điều kiện khó: e2kho-1 (02/11) và e2kho-2 (03/11/2026), vật một lớp, mỗi lớp 6 dòng của
  # config/pose_lists/hard_v2.csv (3 mỗi buổi; số dòng vật một lớp của hai buổi: carton 10/11, nhựa
  # 10/9, gỗ 11/9, metal 10/11, inox 39/40). Render đúng vị trí đo được và góc (yaw danh sách + 90 độ:
  # vạch 0 của thẻ theo +y base, cạnh dài mesh theo +x) của các dòng đó, ánh sáng danh định của profile
  # (scripts/fit_hard_profile.nominal_light), mặt nền và thẻ của profile giữ nguyên. Thước đo: CẢ MẶT
  # TRÊN, mặt nạ chiếu từ hình học tư thế, co 8 px (15 px ở dòng chỉ có tâm thẻ), trên render cắt thêm
  # theo instance: trung vị độ chói tuyến tính chia trung vị nửa trên tấm nền trần cùng khung, màu R/G,
  # B/G là trung bình mặt. Mỗi kênh mô hình r = S + D·p (p = albedo tuyến tính hoặc F0; lượt render thứ
  # hai đặt p = 0 cho S), giải p để trung vị tỉ số tổng hợp/thật theo từng dòng bằng 1; render lại cả
  # 30 dòng ở giá trị giải được trùng mô hình (lệch tới 0,2 %) và trùng trung vị thật (lệch log độ sáng
  # −0,004 đến +0,047). Kiểm chéo hai buổi (khớp một buổi, đoán các dòng của buổi kia, chỉ báo cáo): lệch
  # log độ sáng carton −0,04/+0,05, gỗ −0,17/+0,17, nhựa −0,01/+0,10, metal −0,16/+0,17, inox
  # −0,19/+0,19. Không ảnh val, test, E3-E5 nào vào phép khớp. Mặt trên render đều, mặt thật thì không:
  # p10 và p90 của mặt render cách thật (log) carton +0,16/−0,19, gỗ +0,16/−0,12, nhựa +0,50/−0,24,
  # inox +0,34/−0,18, metal +1,04/−0,75 (hộp metal thật tối với một đốm sáng rộng giữa nắp, có lẽ do nắp
  # hơi phồng phản chiếu vùng sáng phía trên; nền trên cao đồng đều và đèn xa không tạo được đốm đó trên
  # mặt phẳng, kể cả với lớp phủ roughness 0,05). Độ sáng thật còn tăng theo x mà ánh sáng danh định
  # không có (inox, gỗ): giới hạn của mô hình đèn, không của vật. Bảng số và lệnh:
  # synth_fix/appearance/bao_cao.md. Lần khớp 05/11/2026 (commit bcdadfe) dùng ô 17 px ở tâm mặt trên;
  # ô đó rơi vào đốm sáng của metal (F0 0,57-0,61, cả hộp render sáng), nên thay bằng cả mặt.
  #   carton: tuyến tính (0,1226, 0,0730, 0,0242). Số cũ (0,396, 0,318, 0,220) đo 12/09/2026 trên ảnh
  #     điều kiện chuẩn (101, 81, 56).
  #   gỗ: tuyến tính (0,2190, 0,1556, 0,0526). Số cũ (0,471, 0,412, 0,290) đo 12/09/2026 (120, 105, 74).
  #   nhựa: G, B tuyến tính (0,0030, 0,0157). Kênh R NGOÀI TẦM: riêng lớp gương điện môi đã cho R gấp
  #     1,27 lần R thật, nên R ở biên 0, ghi 0,0001 (bước nhỏ nhất của số 4 chữ số) để giữ quy tắc albedo
  #     dương của sampler; nhựa render vẫn đỏ hơn thật (R/G gấp 1,35 lần). Roughness 0,2 và 0,5 cũng không
  #     đưa R/G vào khoảng tứ phân vị thật (thử 05/11/2026). Số cũ (0,0559, 0,1165, 0,1774) khớp ngày
  #     05/11/2026 trên tập train (ánh sáng medium), nay thay bằng số khớp trên E2.
  #
  # sigma_albedo_rel là độ lệch TƯƠNG ĐỐI (phần của chính màu đó), vì độ lệch đo
  # được tỉ lệ thuận với từng kênh — carton lệch 9/101, 8/81, 6/56, đều quanh 0,10.
  # Tức là độ sáng thay đổi giữa các ảnh, KHÔNG phải sắc màu đổi, nên bộ sinh cảnh
  # nhân chung cả ba kênh: carton 0,10, nhựa 0,33, gỗ 0,10.
  # Kiểm ngày 05/11/2026 trên khung E2 điều kiện khó (cùng thước đo ô 17 px): độ lệch log độ sáng trong
  # một buổi carton 0,117 và 0,136, gỗ 0,130 và 0,147 (n 9-11; khoảng tin cậy 95 % đều chứa 0,10); cộng
  # độ trải do vị trí (0,035 carton, 0,060 gỗ ở 6 vị trí E2) và do các yếu tố đèn tự do (0,050), bộ sinh
  # cho 0,117 và 0,127 ở κ = 1. Không mâu thuẫn, nên giữ 0,10.
  # Anchored nhân màu với exp(η), η ~ N(0, (κ·s)²), và mỗi kênh với exp(ξ), ξ ~ N(0,
  # (0,2·κ·s)²): luôn dương. roughness + N(0, (κ·sigma_roughness)²), kẹp [0,02, 1].
  #
  # Lớp KIM LOẠI (metallic 1): f0_rgb là phản xạ pháp tuyến VẬT LÝ (tuyến tính); renderer nhân
  # render.reflectance_scale vì albedo của file này thấp hơn vật lý chừng đó. Anchored: F0 ×
  # exp(η), η ~ N(0, (κ·sigma_f0_rel)²); roughness = r + κ·U(thấp - r, cao - r) với
  # roughness_range là khoảng ở κ = 1, kẹp [0,02, 1]; lớp phủ roughness N(0,30, (κ·0,05)²).
  #   F0 KHỚP trên khung E2 như các lớp điện môi ở trên (p = F0 từng kênh; lớp phủ của metal nằm trong S).
  #   F0 có màu vì nó gánh cả màu môi trường mà gương phản chiếu ở điều kiện khó (tông nền trên cao đo ở
  #   ánh sáng chuẩn); sampler nhân chung một hệ số nên giữ sắc.
  #   inox: thép 304 đánh bóng, F0 (0,4968, 0,5581, 0,4254); số cũ 0,57 (tài liệu). Lệch tương đối 0,053
  #     (0,03 / 0,57) giữ; roughness 0,05 trong 0,02-0,10 (mép đèn sắc trên gương inox train, độ chính
  #     xác cân bằng 0,98); không lớp phủ.
  #   metal (hộp thép sơn): kim loại nhám F0 (0,2428, 0,2617, 0,2663); số cũ 0,34. Ở roughness 0,9 độ sáng
  #     không tuyến tính theo F0 (GGX tán xạ nhiều lần): một lượt render ở F0 0,61-0,67 sáng hơn mô hình
  #     tuyến tính 10 %, nên giải bằng r = S + a·F0·(1 + k·F0), k = 0,40 đo từ lượt đó; lượt kiểm ở giá
  #     trị cuối trùng mô hình (lệch 0,2 %). roughness 0,9 (0,8-1,0) dưới lớp phủ bóng IOR 1,5,
  #     roughness 0,30: hai thùy khớp độ sáng hộp theo góc tới đèn ở 8 vị trí train (tổng hợp/thật 1,03,
  #     rms log 0,12); một thùy GGX không khớp (sáng gấp 4,1 lần gần đèn). Lớp phủ khớp ra phản xạ
  #     0,016-0,020 = 0,04 × 0,46: kiểm độc lập của reflectance_scale.
  # Màu đo cũ của hai lớp kim loại (metal 54,56,56, inox 83,88,78) là màu ảnh, không phải phản xạ:
  # render ra hộp inox và metal tối gấp 4-6 lần ảnh thật.
  materials:
    carton:      {albedo_rgb: [0.385, 0.2994, 0.1687], sigma_albedo_rel: 0.10, roughness: 0.85, metallic: 0.0}
    plastic_box: {albedo_rgb: [0.0001, 0.0386, 0.132], sigma_albedo_rel: 0.33, roughness: 0.80, metallic: 0.0}
    wood_box:    {albedo_rgb: [0.5053, 0.431, 0.2543], sigma_albedo_rel: 0.10, roughness: 0.80, metallic: 0.0}
    metal_box:   {f0_rgb: [0.2428, 0.2617, 0.2663], sigma_f0_rel: 0.15, roughness: 0.90, roughness_range: [0.80, 1.0],
                  metallic: 1.0, coat_ior: 1.5, coat_roughness: 0.30, sigma_coat_roughness: 0.05}
    inox_box:    {f0_rgb: [0.4968, 0.5581, 0.4254], sigma_f0_rel: 0.053, roughness: 0.05,
                  roughness_range: [0.02, 0.10], metallic: 1.0}
  sigma_roughness: 0.08
  # Blind: dải rộng cố định, KHÔNG dùng bất kỳ số đo nào ở trên: albedo (cũng là F0 của phần kim
  # loại) đều từng kênh, metallic đều 0-1, roughness đều 0,02-1 (bao inox 0,02 và metal 1,0), và
  # một nửa số vật có lớp phủ bóng IOR 1,5 với roughness đều trong cùng khoảng.
  # albedo là giá trị mã hóa sRGB; renderer tuyến tính hóa và KHÔNG nhân render.reflectance_scale,
  # kể cả khi vật được rút metallic (khác F0 anchored ở trên, vốn nhân 0,46). F0 kim loại wide-range
  # vì vậy trải 0-0,89 tuyến tính, vẫn bao F0 anchored sau khi nhân (0,21-0,28 tuyến tính).
  # Sàn 0 (trước 05/11/2026 là 0,05): kênh R của nhựa khớp trên khung E2 là 0,0001, dưới 0,05,
  # nên sàn 0,05 để màu thật của lớp nhựa nằm ngoài dải rộng.
  blind_albedo_range: [0.0, 0.95]
  blind_roughness_range: [0.02, 1.0]
  blind_coat_probability: 0.5

distractors:
  count_range: [0, 3]            # anchored: ít distractor (cell thật gọn)
  blind_count_range: [0, 5]
  size_range_mm: [20.0, 80.0]

exposure:
  # Phơi sáng của buổi: mỗi cảnh một độ lợi g log-đều trong gain_range, nhân sensor.gain. Factor
  # TỰ DO: rút như nhau ở hai recipe, mọi κ, mọi nhánh E5 (κ chỉ mở rộng đèn/màu quanh profile),
  # từ luồng riêng SeedSequence([seed, index, 2]).
  # Vì sao độ lợi: ba lần kiểm bàn trống cho trung bình ảnh tuyến tính 0,016/0,022/0,033 (AE không giữ
  # mức ảnh), còn nhiễu đi theo mức như độ lợi: 2,03 ở luma 21,5 và 2,54 ở 30,3 (tỉ số 1,25; mô hình độ
  # lợi 1,26, đổi ánh sáng 0,93). Không mô phỏng AE theo nội dung: giữ trung bình ảnh thì ảnh có vật (vật
  # che thẻ trắng) ra sáng hơn ảnh kiểm. Khoảng: bước kiểm nhận mỗi nửa bàn 10-45 (lấy từ 110 ảnh CÓ vật);
  # với màu hai nửa bàn của profile ở g = 1, nửa trên chạm 10 ở 0,43, nửa dưới chạm 45 ở 2,90
  # (hard_profile.admitted_gain_range; test kiểm khớp lại sau mỗi lần khớp profile).
  gain_range: [0.43, 2.90]
  check_luminance: [10.0, 45.0]
  reference_upper_rgb: [0.0537, 0.0937, 0.0635]   # (13,7, 23,9, 16,2)/255, profile ở g = 1
  reference_lower_rgb: [0.0773, 0.1059, 0.0816]   # (19,7, 27,0, 20,8)/255

# =============================================================================
# Phần do renderer đọc (src/synthgen/render_blenderproc.py qua hard_profile.py).
# Schema của sampler (anchored_config.py) bỏ qua các khóa này.
# =============================================================================

render:
  # Mọi lô của mọi nhánh render bằng CÙNG thiết lập này; render_manifest.json ghi lại, và
  # hai nhánh khác nhau ở đây không được so với nhau (hard_profile.check_arms_match: trong một gói và
  # giữa hai nhánh E4 khi đóng gói; các nhánh E3, E5 bằng scripts/check_render_arms.py).
  # 24 mẫu/px như docs/HUONG_DAN_HUAN_LUYEN.md (16-28 s/ảnh trên MX150); --samples chỉ để
  # chạy thử, vì số mẫu thực dùng được ghi vào manifest.
  samples: 24
  denoiser: INTEL              # mặc định của BlenderProc (OIDN qua compositor)
  noise_threshold: 0.01        # mặc định của BlenderProc (lấy mẫu thích nghi)
  # Mặc định BlenderProc là glossy 0 và tổng 3: mặt gương không phản chiếu gì nên hộp inox
  # ra đen. 4 lần phản xạ gương đủ cho hộp inox soi bàn, thẻ và hộp bên cạnh soi lại.
  diffuse_bounces: 3
  glossy_bounces: 4
  max_bounces: 8
  transmission_bounces: 0
  transparent_max_bounces: 8
  # Không tone-map: sensor_model áp đường cong sRGB chuẩn lên ảnh tuyến tính (EXR). Trước
  # 11/2026 ảnh ra qua Filmic của BlenderProc (chú thích cũ ghi nhầm là AgX).
  view_transform: Standard
  # Đổi phản xạ gương VẬT LÝ sang thang albedo của file này: F0 kim loại, lớp gương điện môi (F0
  # 0,04) và trọng số lớp phủ đều nhân số này. Thang albedo lấy bàn chuẩn trần làm gốc (0,305 tuyến
  # tính); bàn vật lý là 0,66 NẾU thẻ trắng là giấy phản xạ 0,85 (giả định, chưa đo): thẻ/bàn trần
  # 1,29 (ảnh kiểm chuẩn e2chuan-2, đã sửa đảo R/B), 0,85 / 1,29 = 0,66, và 0,305 / 0,66 = 0,46.
  # Giấy 0,80-0,90 cho 0,44-0,49. Kiểm độc lập: lớp phủ hộp metal khớp ra 0,016-0,020 = 0,04 × 0,46.
  reflectance_scale: 0.46

sensor:
  # Mô hình cảm biến (src/synthgen/sensor_model.py): y = gain * white_balance * x, nhiễu
  # phương sai gain*shot_noise*y + gain^2*read_noise trong miền tuyến tính, hạt nhiễu làm mờ
  # Gauss grain_sigma_px rồi chuẩn hóa, rồi đường cong sRGB và làm tròn 8 bit.
  # gain 1 = trạng thái tự phơi sáng của bước kiểm điều kiện, nơi mọi số ở đây được khớp; mỗi
  # cảnh nhân nó với độ lợi phơi sáng exposure.gain của spec (mục exposure).
  gain: 1.0
  # Cân bằng trắng của camera ở điều kiện khó, so với thang điều kiện chuẩn: khớp để thẻ
  # trắng render ra đúng màu thẻ đo trên hai ảnh kiểm điều kiện, sRGB (96,9, 98,8, 92,5)
  # trên 255 (trung vị các ô vùng thẻ), dưới ánh sáng danh định (nền trên cao tông lục mang
  # 0,487 độ rọi). Kênh G giữ 1; độ sáng chung nằm ở lighting.anchor_irradiance. Bản trước
  # (1,048, 1, 1,008) dùng tỉ số thẻ/bàn với R và B tráo nhau và không có tông của nền trên cao.
  white_balance_rgb: [1.1644, 1.0, 1.0169]
  # Nhiễu MỘT khung, đo trên ảnh kiểm điều kiện e2kho-2: mỗi ảnh kiểm là trung bình 10 khung,
  # nên hiệu hai lần kiểm cách nhau 10 s (dieu_kien/lan_1, lan_2 so với lan_3, chỉ các điểm
  # ảnh phẳng mà lớp phủ để nguyên) khử vân của tấm nền; nửa phương sai của hiệu, trừ phần
  # làm tròn 8 bit, nhân 10 là phương sai một khung. Thước đo: độ lệch chuẩn phần dư sau
  # khi trừ trung bình ô 7x7 (sensor_model.highpass_noise_std). Kết quả 2,13 ở luma 23
  # (tấm nền) và 2,37 ở luma 111 (thẻ).
  # shot_noise khớp để tấm nền của profile ra đúng 2,13 (luma 19,9 trên ảnh khớp). Khớp
  # chung cả hai mức thì read_noise về 0: nhiễu thật không giảm về phía tối, còn nhiễu
  # photon qua đường cong sRGB gần như phẳng, nên mức thẻ ra 1,62 thay vì 2,37 (thấp 32%).
  shot_noise: 0.000462
  read_noise: 0.0
  # Hạt nhiễu: phần dư của hiệu hai lần kiểm tương quan 0,644 với điểm ảnh bên cạnh (đã bù
  # phần làm tròn); làm mờ Gauss 0,924 px cho đúng tương quan đó.
  grain_sigma_px: 0.924

hard_profile:
  # Điều kiện ảnh của mọi lượt E3-E5 (novel_background_dim): tấm nền xanh phủ bàn, đèn dịu,
  # 21 thẻ vị trí trắng, vạch đen ngang bàn, mép bàn và cell xung quanh. Cả hai recipe dùng
  # chung: sampler rút màu tấm nền (background.anchor_albedo_rgb) và đèn quanh số khớp ở
  # đây; các phần tử tĩnh giữ như đo. Mọi số khớp bằng scripts/fit_hard_profile.py, CHỈ trên
  # ảnh bàn trống của bước kiểm điều kiện, không dùng ảnh lượt thử hay ảnh test.
  # Hình học: camera lỗ kim + T_base_camera.npy (hiệu chuẩn tay-mắt giải với méo = 0), chiếu
  # ngược lên mặt bàn z 593,9 mm; hệ base, mm. Hai buổi lệch nhau dưới 1,5 mm, lấy trung bình.
  table:
    # Góc mặt bàn: gần-trái, gần-phải, xa-phải, xa-trái. Mép gần (phía robot) và hai mép
    # bên khớp đường thẳng trên ảnh (sai số 0,4-2,4 px); bàn rộng 1000 mm, lệch ~0,8 độ so với
    # trục base. Mép xa nằm ngoài ảnh (ảnh chỉ tới x ~1015): đặt 100 mm sau hàng ảnh cuối.
    corners_mm: [[257.0, -467.8], [240.8, 529.6], [1125.9, 543.8], [1125.9, -462.4]]
