# =============================================================================
# synthgen.yaml — Cấu hình sinh dữ liệu synthetic (C2: calibration-anchored DR)
# =============================================================================
# Dùng bởi scripts/20_generate_synth.py qua src/synthgen/anchored_config.py.
#
# NGUYÊN TẮC (khớp Eq. (1) + Table "factors" trong paper):
#   - Factor "anchored": phân phối TÂM tại giá trị hiệu chuẩn/đo được của cell,
#     độ rộng = κ·σ. σ ưu tiên lấy từ config/calibration/T_base_camera_sigma.json
#     (bootstrap — scripts/02_run_calibration.py --bootstrap 200); các giá trị
#     sigma_* dưới đây chỉ là FALLBACK khi chưa có file đó.
#   - Factor "free" (biến nhiệm vụ: pose vật, số vật): randomize toàn dải
#     ở CẢ hai chế độ anchored lẫn blind.
#   - Chế độ --mode blind: biên rộng cố định ở các khóa blind_* và recipe vật liệu
#     khác; vẫn dùng CÙNG camera reference T_BC và intrinsics. Vì vậy đây không phải
#     đối chứng độc lập với calibration hoặc chỉ khác một nguồn uncertainty.
#
# ⚠ Các giá trị đánh dấu [MEASURE] là proxy tạm — phải đo tại cell thật rồi
#   cập nhật trước khi chạy E3 (xem WORKFLOW_CODE_TO_PAPER.md mục 5).
# =============================================================================

camera:
  # Anchor nội tại: số ĐO của chính camera trên cell, đọc từ T_base_camera_meta.json của
  # lần hiệu chuẩn 18/09/2026 (D455 serial 241122301774, luồng màu 1280x720).
  intrinsics:
    fx: 645.007
    fy: 644.202
    ppx: 647.286
    ppy: 368.784
    width: 1280
    height: 720
  # Fallback σ khi chưa có T_base_camera_sigma.json (đơn vị mm / deg / px)
  sigma_trans_mm: [2.0, 2.0, 2.0]
  sigma_rot_deg: [0.5, 0.5, 0.5]
  sigma_intrinsics_px: 2.0
  # Blind: dải rộng cố định (uniform ±)
  blind_trans_mm: 100.0
  blind_rot_deg: 10.0
  blind_intrinsics_px: 30.0

lighting:
  # VỊ TRÍ vẫn là [MEASURE]: proxy 2 nguồn sáng trần phía trên bàn, chưa đo thật.
  anchor_positions_mm:
    - [700.0, -300.0, 1800.0]
    - [700.0, 300.0, 1800.0]
  # CÔNG SUẤT hiệu chuẩn ngày 12/09/2026: render mặt bàn trống rồi khớp độ sáng với
  # ảnh thật. Ở 60 W mỗi đèn, vùng bàn trống trong ảnh render có luma 199, trong khi
  # 16 ảnh bàn trống thật ở điều kiện chuẩn cho luma 150; hệ số khớp là 0,32 → 19 W.
  # ⚠ Con số này gắn với VỊ TRÍ đèn giả định ở trên. Đo được vị trí đèn thật thì phải
  #   suy lại công suất, vì độ rọi phụ thuộc khoảng cách.
  # ⚠ D455 chụp dataset ở chế độ TỰ ĐỘNG phơi sáng (không chỗ nào trong repo đặt exposure).
  #   Nên đây là khớp với thứ CAMERA XUẤT RA, không phải với độ rọi thật tính bằng lux.
  #   Với dữ liệu huấn luyện thì khớp như vậy mới đúng, vì detector nhìn ảnh camera. Nhưng
  #   nhớ rằng điều kiện thiếu sáng ngoài đời TỐI HƠN tỉ lệ 0,46 đo trên ảnh, do camera đã
  #   tự bù một phần.
  anchor_intensity_w: 19.0
  anchor_color_temp_k: 5000.0
  # Anchored: công suất = tham chiếu × exp(η), η ~ N(0, (κ·0,20)²), nên luôn dương, không
  # dồn về một mức sàn (số cũ 1 + η cắt ở 1 W: 23% cảnh có đèn ở sàn khi κ = 4). Độ cao đèn
  # trên mặt bàn h = h* × exp(δ/h*), δ ~ N(0, (κ·150)²): gần tâm vẫn lệch chuẩn κ·150 mm,
  # nhưng không κ nào đưa đèn xuống bàn (số cũ: 2,2% đèn dưới mặt bàn khi κ = 4).
  sigma_position_mm: 150.0
  sigma_intensity_frac: 0.20
  sigma_color_temp_k: 300.0
  # Blind (wide-range)
  blind_count_range: [1, 4]
  blind_position_box_mm: [[200.0, 1200.0], [-600.0, 600.0], [800.0, 2000.0]]
  # Công suất mỗi đèn = anchor_intensity_w × f, f log-uniform trong khoảng này, nên theo neo
  # khi neo được khớp lại. Dải cũ 10-200 W tuyệt đối đặt khi neo còn 60 W; neo xuống 19 W thì
  # dải nằm hết phía SÁNG: độ rọi tâm vùng gắp 1,6/11,5/38,8 lần neo (P5/P50/P95), không cảnh
  # nào tối. Khoảng 0,3/9 đến 0,3×9 lần neo: tâm log 0,3 chọn để trung vị độ rọi tâm vùng gắp
  # (575, 20) bằng neo, vì 1-4 đèn trong hộp trên, thấp hơn hai đèn neo ở 1800 mm, rọi mạnh
  # hơn ở cùng công suất. Đo trên 3000 cảnh: độ rọi 0,062/1,00/5,5 lần neo (P5/P50/P95), 6,6%
  # cảnh tới mức tối 0,08; anchored κ = 4 là 0,17/0,69/3,0. Đổi vị trí đèn neo hay hộp thì
  # phải đo lại (test_scene_sampler.py kiểm trung vị).
  blind_intensity_rel_range: [0.033, 2.7]
  blind_color_temp_range_k: [2500.0, 9000.0]

background:
  # ĐO ngày 12/09/2026 từ 16 ảnh bàn trống ở điều kiện chuẩn (vùng giữa mặt bàn):
  # sRGB trung vị (150, 151, 150), tức xám TRUNG TÍNH chứ không ngả xanh như số cũ
  # [0.50, 0.52, 0.55]; độ lệch giữa các ảnh 0.049 — số 0.05 cũ trúng.
  # Chỉ lấy ảnh điều kiện chuẩn: gộp cả ảnh thiếu sáng và đèn xiên vào thì độ lệch
  # vọt lên 0.25, nhưng đó là biến thiên ÁNH SÁNG, đã có yếu tố riêng lo rồi.
  anchor_albedo_rgb: [0.590, 0.592, 0.588]
  sigma_albedo: 0.05
  anchor_roughness: 0.8
  blind_albedo_range: [0.05, 0.95]

objects:
  # class_name → mesh (đường dẫn tương đối repo root). 5 hộp của bộ dữ liệu paper.
  #
  # THỨ TỰ NÀY LÀ CHUẨN — phải khớp với auto_label.DEFAULT_CLASS_NAMES và
  # dataset_check.EXPECTED_NAMES. Lệch thứ tự thì mô hình vẫn train được nhưng
  # tráo lớp lúc chạy; dataset_check tồn tại chính là để bắt lỗi đó.
  #
  # Mesh dựng bằng scripts/gen_product_meshes.py theo KÍCH THƯỚC ĐO BẰNG THƯỚC KẸP
  # (dài × rộng × cao, mm), đo ngày 2026-09-11:
  #     carton (2 cỡ) 180×120×120 và 180×100× 80
  #     plastic_box   180×140× 30     wood_box   190×190×150
  #     metal_box     190×135× 85     inox_box   180× 85× 40
  # Lớp carton gồm hai hộp thật khác cỡ nên nhận DANH SÁCH mesh; bộ sinh cảnh chọn
  # một cỡ cho mỗi lần đặt vật, cả hai đều mang nhãn carton. Chiều cao ở đây nuôi
  # thẳng chế độ plane của C4 (z_from_ground_plane), nên sai mesh là sai điểm kẹp.
  #
  # Sim/demo còn dùng bộ bottle/cup/bolt/tray riêng (detector.DEFAULT_CLASS_NAMES)
  # — KHÔNG liên quan ở đây.
  classes:
    carton:      ["models/objects/carton_large.stl", "models/objects/carton_small.stl"]
    plastic_box: "models/objects/plastic_box.stl"
    wood_box:    "models/objects/wood_box.stl"
    metal_box:   "models/objects/metal_box.stl"
    inox_box:    "models/objects/inox_box.stl"
  class_ids:
    carton: 0
    plastic_box: 1
    wood_box: 2
    metal_box: 3
    inox_box: 4
  # Kích thước [dài, rộng, cao] mm của từng mesh, đúng số thước kẹp ở trên (dài theo trục X
  # của mesh, đáy ở z = 0; test so với file STL). Dùng cho phép kiểm chồng hình chữ nhật xoay
  # và cho độ cao mặt trên của vật đỡ khi xếp chồng.
  mesh_sizes_mm:
    models/objects/carton_large.stl: [180.0, 120.0, 120.0]
    models/objects/carton_small.stl: [180.0, 100.0, 80.0]
    models/objects/plastic_box.stl:  [180.0, 140.0, 30.0]
    models/objects/wood_box.stl:     [190.0, 190.0, 150.0]
    models/objects/metal_box.stl:    [190.0, 135.0, 85.0]
    models/objects/inox_box.stl:     [180.0, 85.0, 40.0]
  # Số CHỖ ĐẶT trên bàn mỗi cảnh: một vật, hoặc một vật đỡ có vật khác nằm trên (xếp chồng
  # tính là một chỗ). Hình chiếu đáy các chỗ đặt không chồng nhau. Vùng tâm vật bên dưới
  # đã bằng đúng lưới thẻ cộng dung sai 15 mm (sâu 130 mm theo x) nên không nới được mà vẫn
  # giữ hình học của phép thử thật. Đo trên 3000 cảnh, 200 lần rút cho mỗi chỗ đặt: với ba
  # chỗ, 28,5% chỗ thứ hai và thứ ba không tìm được tư thế trống và chỉ 43% cảnh đủ ba; với
  # hai chỗ, 0,4% chỗ thứ hai bị bỏ. Nên giới hạn ở hai. Lượt gắp thật có đúng một chỗ đặt
  # (một vật hoặc một cặp chồng).
  count_range: [1, 2]
  # Lớp của vật THỨ NHẤT và vật đỡ của nó: đếm trên tư thế 1-200 của
  # config/pose_lists/hard_v2.csv và std_v2.csv (hai danh sách trùng nhau từng dòng về
  # class_hint và stack_on; test đếm lại từ hai file). single = số dòng không chồng,
  # stacked_on = số dòng theo lớp vật đỡ (vật đỡ đặt lên thẻ trước, vật được gọi nằm trên).
  # Tổng 200 dòng: inox 100 (50%), mỗi lớp khác 25; 40 dòng xếp chồng (20%). Các vật sau
  # vật thứ nhất vẫn chọn lớp đều. Cỡ carton chọn đều 50/50 ở mọi vai, như file
  # <list>_carton.csv (scripts/28_make_carton_sizes.py chia đôi cỡ trong từng nhóm vai).
  first_object_mix:
    carton:      {single: 21, stacked_on: {plastic_box: 4}}
    plastic_box: {single: 19, stacked_on: {wood_box: 6}}
    wood_box:    {single: 20, stacked_on: {metal_box: 5}}
    metal_box:   {single: 21, stacked_on: {inox_box: 4}}
    inox_box:    {single: 79, stacked_on: {plastic_box: 5, metal_box: 5, carton: 5, wood_box: 6}}
  # Tâm vật nằm trên lệch tâm vật đỡ tối đa ngần này mỗi trục: dung sai đặt vật ±15 mm
  # (HUONG_DAN_THI_NGHIEM_CELL_THAT.md, B1). Góc của vật đỡ không được gọi trong phép thử
  # nên chọn độc lập.
  stack_offset_mm: 15.0
  # Vùng ĐẶT VẬT (placement envelope): nơi đặt vật khi gắp thật, dùng chung cho ba chỗ:
  # lưới thẻ (22_make_pose_lists.py, lề 15 mm = dung sai đặt vật), ô chia lỗi của vòng C3
  # (21_mine_failures.py) và vị trí vật trong ảnh tổng hợp.
  # Tính từ hiệu chuẩn tay-mắt 18/09/2026 (camera tại x = 638.6 mm sau khi bù phép chạm thử
  # 24/09/2026, cách bàn 712.7 mm), GIỮ
  # NGUYÊN camera và dataset. Hai giới hạn kẹp nhau:
  #   - phía gần robot: dưới x ~ 510, vật cao và chồng hai lớp (tới 235 mm) bị cắt ở mép ảnh;
  #   - phía xa: trên x ~ 640, tư thế tiếp cận 200 mm trên chồng 235 mm vượt tầm với GP7 khi
  #     dụng cụ dài 180-190 mm (người dùng báo mặt bích tới mặt dưới kẹp ~180 mm, 21/09/2026).
  # Đã kiểm mọi lớp, mọi kiểu chồng, mọi góc 5 độ, cộng dung sai ±15 mm: lề ảnh nhỏ nhất 8,6 px
  # (14 px trước khi bù phép chạm thử 24/09/2026; nadir camera dịch ra xa robot 4 mm), ở thẻ
  # (525, −160). IK giải hết cho cả 300 tư thế của hai danh sách với dụng cụ 178 mm đo được
  # ngày 24/09/2026, và với 180 mm. Dataset: 50-65% vật của từng lớp, ở cả bốn tập
  # train/val/test chuẩn/test khó, nằm ở x >= 510, nên vùng này nằm trong phân bố ảnh thật.
  # Số cũ 277..562 x ±390 suy từ một mô hình camera ước lượng trước khi có hiệu chuẩn, sai ~100 mm.
  region_x_mm: [510.0, 640.0]
  region_y_mm: [-175.0, 215.0]
  table_z_mm: 593.9              # đỉnh mặt bàn, world frame: z_top_mm của table_plane.json 18/09/2026
  yaw_range_deg: [-90.0, 90.0]

  # Diện mạo từng lớp. KHÔNG có khối này thì mọi vật render ra màu xám trắng như
  # nhau, và dữ liệu tổng hợp không dạy detector được gì về màu sản phẩm.
  #
  # albedo_rgb là số ĐO ngày 12/09/2026: màu trung vị của các pixel thuộc mặt nạ
  # người vẽ, trên ảnh điều kiện chuẩn (60 ảnh 1-vật mỗi lớp), chia cho 255:
  #   carton 101,81,56   plastic 8,38,57   wood 120,105,74
  #   metal  54,56,56    inox    83,88,78
  #
  # sigma_albedo_rel là độ lệch TƯƠNG ĐỐI (phần của chính màu đó), vì độ lệch đo
  # được tỉ lệ thuận với từng kênh — carton lệch 9/101, 8/81, 6/56, đều quanh 0,10.
  # Tức là độ sáng thay đổi giữa các ảnh, KHÔNG phải sắc màu đổi, nên bộ sinh cảnh
  # nhân chung cả ba kênh. Nhiễu ba kênh độc lập ở bề rộng này sẽ biến hộp thép xám
  # thành hộp xanh lá.
  #   carton 0,10   plastic 0,33   wood 0,10   metal 0,31   inox 0,55
  # Inox lệch gấp năm lần carton vì mặt gương phản chiếu xung quanh — đúng thứ đóng
  # góp C4 nói tới.
  # Anchored nhân màu với exp(η), η ~ N(0, (κ·s)²), và mỗi kênh với exp(ξ), ξ ~ N(0,
  # (0,2·κ·s)²): luôn dương. Hệ số cũ max(0, 1 + η) cho inox đen hẳn ở 17,7% (κ = 2) và
  # 31,8% (κ = 4) số vật.
  #
  # roughness và metallic là ƯỚC LƯỢNG vật lý, không phải số đo: chúng quyết định
  # bề mặt phản xạ thế nào. [MEASURE nếu có máy đo độ bóng]
  materials:
    carton:      {albedo_rgb: [0.396, 0.318, 0.220], sigma_albedo_rel: 0.10, roughness: 0.85, metallic: 0.0}
    plastic_box: {albedo_rgb: [0.031, 0.149, 0.224], sigma_albedo_rel: 0.33, roughness: 0.35, metallic: 0.0}
    wood_box:    {albedo_rgb: [0.471, 0.412, 0.290], sigma_albedo_rel: 0.10, roughness: 0.80, metallic: 0.0}
    metal_box:   {albedo_rgb: [0.212, 0.220, 0.220], sigma_albedo_rel: 0.31, roughness: 0.55, metallic: 0.7}
    inox_box:    {albedo_rgb: [0.325, 0.345, 0.306], sigma_albedo_rel: 0.55, roughness: 0.10, metallic: 1.0}
  sigma_roughness: 0.08
  # Blind: dải rộng cố định, KHÔNG dùng bất kỳ số đo nào ở trên.
  blind_albedo_range: [0.05, 0.95]
  blind_roughness_range: [0.05, 1.0]

distractors:
  count_range: [0, 3]            # anchored: ít distractor (cell thật gọn)
  blind_count_range: [0, 5]
  size_range_mm: [20.0, 80.0]
