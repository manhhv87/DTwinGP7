[project]
name = "pickplace-gp7"
version = "1.0.0"
description = "Vision-guided pick-and-place cho Yaskawa GP7 — Digital Twin với RoboDK Free + YOLOv8"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
# pythonpath = project root → cho phép `from src.xxx import ...`
pythonpath = ["."]
markers = [
    "hardware: tests cần phần cứng thật (RealSense/RoboDK/GP7) — skip trong CI",
]
